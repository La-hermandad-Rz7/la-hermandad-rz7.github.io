name: Atualizar sistema RZ7

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar atualização
        run: python3 scripts/update_rz7.py

      - name: Validar JavaScript
        run: |
          python3 - <<'PY'
          import base64,re
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          m=re.search(r'atob\("([A-Za-z0-9+/=]+)"\)',s)
          if not m: raise SystemExit("JS embutido não encontrado")
          Path("/tmp/rz7.js").write_bytes(base64.b64decode(m.group(1)))
          PY
          node --check /tmp/rz7.js

      - name: Commit atualização
        run: |
          git config user.name "RZ7 Deploy Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nova."
            exit 0
          fi
          git commit -m "feat: sistema RZ7 atualizado"
          git push

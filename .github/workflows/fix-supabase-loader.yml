name: Fix Supabase loader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inline Supabase client
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import re, urllib.request
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          url = "https://unpkg.com/@supabase/supabase-js@2.117.0/dist/umd/supabase.min.js"
          lib = urllib.request.urlopen(url, timeout=30).read().decode("utf-8")

          pattern = re.compile(r'<script[^>]+src=["\']https://(?:cdn\.jsdelivr\.net|unpkg\.com)/[^"\']*supabase-js@2(?:\.[^"\']*)?["\'][^>]*></script>', re.I)
          if not pattern.search(s):
              pattern = re.compile(r'<script[^>]+src=["\'][^"\']*supabase-js@2\.117\.0[^"\']*["\'][^>]*></script>', re.I)

          replacement = "<script>\n/* Supabase JS inlined by RZ7 deploy fix */\n" + lib + "\n</script>"
          s2, n = pattern.subn(replacement, s, count=1)

          if n != 1:
              raise SystemExit("Não encontrei a tag do Supabase no index.html.")

          if s2 == s:
              raise SystemExit("Nenhuma alteração feita.")

          p.write_text(s2, encoding="utf-8")
          print("Supabase client inline aplicado.")

          PY

      - name: Commit patched index
        shell: bash
        run: |
          git config user.name "RZ7 Deploy Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
          else
            git commit -m "fix: inline Supabase client for instructor login"
            git push
          fi

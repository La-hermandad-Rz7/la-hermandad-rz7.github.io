<head>

<meta name="theme-color" content="#080808">
<style>
:root{--bg:#080808;--panel:#101010;--panel2:#151515;--gold:#d7ad42;--gold2:#8d6a21;--text:#f3f0e7;--muted:#a6a29a;--danger:#c94a4a;--ok:#4db56a;--line:#292929}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#19140a 0,#080808 38%,#050505 100%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20;background:linear-gradient(#080808e8,#080808b8,transparent)}.iconbtn,.infoBtn{border:1px solid #3a301d;background:#0d0d0dcc;color:var(--text);border-radius:12px;padding:10px 12px}.infoBtn{color:#ead9a6}.wrap{max-width:1050px;margin:auto;padding:88px 18px 42px}.hero{text-align:center;min-height:calc(100vh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center}.logo{width:150px;height:150px;object-fit:contain;border-radius:28px;display:block;margin-bottom:18px;filter:drop-shadow(0 0 28px #d7ad4230)}.logoFallback{width:150px;height:150px;border:1px solid #5c4720;border-radius:28px;display:grid;place-items:center;font-weight:900;font-size:34px;color:var(--gold);margin-bottom:18px}.diamond{color:var(--gold);letter-spacing:8px;margin:4px 0 18px}.title{font-size:clamp(28px,7vw,52px);letter-spacing:2px;font-weight:900;margin:0}.sub{font-size:18px;letter-spacing:4px;color:#d7cda9;margin:8px 0}.tag{color:var(--muted);margin:8px 0 28px}.primary{background:linear-gradient(135deg,#e3bf5c,#9e7626);color:#0a0906;border:0;border-radius:13px;padding:15px 28px;font-weight:900;box-shadow:0 8px 30px #000}.ghost{background:#0f0f0f;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px 14px}.gold{border-color:#6f5421;color:#e6cb7c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:linear-gradient(180deg,#151515,#0d0d0d);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 40px #0005}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.form{display:grid;gap:11px}.form input,.form textarea,.form select{width:100%;background:#090909;border:1px solid #303030;color:var(--text);border-radius:10px;padding:12px;outline:none}.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--gold2)}.form textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap}.hidden{display:none!important}.back{margin-bottom:14px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}.sectionTitle h1{margin:0;font-size:28px}.list{display:grid;gap:10px}.row{background:#0d0d0d;border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:#202020;border:1px solid #333;color:#ddd;font-size:12px}.ok{color:#72d18b}.bad{color:#ff7676}.goldtxt{color:#e4c56c}.menu{position:fixed;inset:0 auto 0 0;width:min(330px,88vw);background:#0a0a0af7;border-right:1px solid #332816;z-index:50;padding:80px 18px 20px;transform:translateX(-105%);transition:.2s}.menu.open{transform:none}.menu button{display:block;width:100%;text-align:left;background:#111;border:1px solid var(--line);color:var(--text);padding:14px;border-radius:11px;margin:8px 0}.overlay{position:fixed;inset:0;background:#0009;z-index:40}.notice{padding:12px;border:1px solid #3c321f;background:#17130a;border-radius:12px;color:#dec77f}.result{max-width:520px;margin:20px auto}.resultbox{border:1px solid #5d4820;border-radius:18px;padding:18px;background:#0b0b0b}.resultbox pre{font:inherit;white-space:pre-wrap}.question{margin:16px 0}.option{display:block;width:100%;text-align:left;background:#0b0b0b;border:1px solid #333;color:var(--text);padding:13px;border-radius:10px;margin:8px 0}.option.selected{border-color:var(--gold);background:#1b160a}.progress{height:8px;background:#202020;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--gold);width:0}.adminbar{display:flex;gap:8px;overflow:auto;margin-bottom:15px;padding-bottom:3px}.adminbar button{white-space:nowrap}.danger{border-color:#693333;color:#ff8b8b}.small{font-size:12px}.footer{text-align:center;color:#777;margin-top:40px;font-size:12px}.manualHeader{text-align:center;margin:10px auto 22px;max-width:820px;padding:24px 10px;border-bottom:1px solid #332816}.manualHeader h1{margin:6px 0;font-size:clamp(28px,7vw,44px);letter-spacing:1px}.manualHeader p,.manualKicker{color:#d7c27d;letter-spacing:3px;font-size:12px}.manualKicker{font-weight:800}.manualIntro{max-width:820px;margin:0 auto 14px;border-color:#5a4520}.manualIntro h2{margin-top:0}.quote{color:#e4c56c;font-style:italic}.manualSections{max-width:820px;margin:auto}.manualButtons{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 auto 16px}.manualBtn{width:100%;text-align:left;padding:17px 16px;background:linear-gradient(180deg,#151515,#0d0d0d);border:1px solid #332816;border-radius:14px;color:var(--text);font-weight:800;transition:.16s transform,.16s border-color,.16s box-shadow}.manualBtn:hover,.manualBtn:focus{transform:translateY(-2px);border-color:#8d6a21;box-shadow:0 8px 24px #0007;outline:none}.manualBtn.active{border-color:var(--gold);box-shadow:0 0 0 1px #d7ad4233,0 8px 24px #0007}.manualBtn small{display:block;margin-top:5px;color:#8f8b83;font-weight:500}.manualView{margin-top:14px}.manualSection{position:relative;max-width:820px;margin:0 auto}.manualSection h2{margin:0 0 14px;font-size:22px}.manualBody{line-height:1.75;color:#ddd9cf}.manualBody p{margin:8px 0}.manualNum{color:#d7ad42;font-weight:900;font-size:13px;margin-bottom:8px}.equiv{display:grid;gap:8px}.equiv div{display:flex;justify-content:space-between;gap:15px;padding:11px 12px;background:#0a0a0a;border:1px solid #292929;border-radius:10px}.equiv b{color:#d7ad42}.equiv span{text-align:right}.progression{display:flex;flex-wrap:wrap;align-items:center;gap:7px;line-height:1.8}.progression span{padding:6px 9px;border:1px solid #3a301d;background:#0a0a0a;border-radius:8px;color:#e8dfc6}.progression i{color:#d7ad42;font-style:normal}.manualFooter{text-align:center;color:#716d64;font-size:11px;letter-spacing:2px;padding:28px 5px 10px}
</style>

<body>
<header class="top"><button class="iconbtn" id="menuBtn">☰ MENU</button><button class="infoBtn" id="infoBtn">ℹ️ INFORMAÇÕES RZ7</button></header>
<div id="menu" class="menu"><button data-go="home">🏠 INÍCIO</button><button data-go="admin">👑 ADMINISTRAÇÃO</button></div><div id="overlay" class="overlay hidden"></div>
<main class="wrap" id="app"><section class="hero"><div class="logoFallback">RZ7</div><div class="diamond">──── ◈ ────</div><h1 class="title">PROVA DE CONHECIMENTO</h1><div class="sub">LA HERMANDAD RZ7</div><div class="tag">Sistema oficial de avaliação da Hermandad</div><button class="primary" id="candidateBtn">👤 CANDIDATO · COMEÇAR</button><div class="footer">── LA HERMANDAD RZ7 ──<br>© RZ7</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient}=supabase;
const SUPABASE_URL='https://euazdymywhtgunjmztuv.supabase.co';
const SUPABASE_KEY='sb_publishable_XifsKYxSfBB-MITOf9s1Bw_W-5gfXaT';
const sbCandidate=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'rz7_candidate_auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const sbAdmin=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'rz7_admin_auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let sb=sbCandidate;
const app=document.getElementById('app'),menu=document.getElementById('menu'),overlay=document.getElementById('overlay');
let me=null, profile=null, perms=new Set(), currentAttempt=null, timer=null, supreme=false;
function useAuth(kind){sb=kind==='admin'?sbAdmin:sbCandidate;me=null;profile=null;perms=new Set();supreme=false;}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const toast=m=>alert(m);
function closeMenu(){menu.classList.remove('open');overlay.classList.add('hidden')}
document.getElementById('menuBtn').onclick=()=>{menu.classList.add('open');overlay.classList.remove('hidden')};overlay.onclick=closeMenu;
document.querySelectorAll('#menu [data-go]').forEach(b=>b.onclick=()=>{closeMenu();go(b.dataset.go)});
document.getElementById('infoBtn').onclick=()=>go('info');
function logoHtml(url){return url?'<img class="logo" src="'+esc(url)+'" alt="RZ7">':'<div class="logoFallback">RZ7</div>'}
async function loadMe(){const {data:{user}}=await sb.auth.getUser();me=user||null;if(!me){profile=null;perms=new Set();return}const {data:p}=await sb.from('rz7_profiles').select('*').eq('user_id',me.id).maybeSingle();profile=p||null;supreme=false;if(profile){const {data:rr}=await sb.from('rz7_roles').select('is_supreme').eq('id',profile.role_id).maybeSingle();supreme=!!rr?.is_supreme;const {data:rps}=await sb.from('rz7_role_permissions').select('permission_id,rz7_permissions(key)').eq('role_id',profile.role_id);(rps||[]).forEach(x=>{if(x.rz7_permissions?.key)perms.add(x.rz7_permissions.key)});const {data:ups}=await sb.from('rz7_user_permissions').select('allowed,rz7_permissions(key)').eq('user_id',me.id);(ups||[]).forEach(x=>{if(x.rz7_permissions?.key){if(x.allowed)perms.add(x.rz7_permissions.key);else perms.delete(x.rz7_permissions.key)}})}}
function can(p){return profile?.account_status==='active'&&(supreme || perms.has(p))}
function hasAdminAccess(){return profile?.account_type==='admin'||profile?.account_type==='instructor'}
async function getSettings(){const {data}=await sb.from('rz7_system_settings').select('*');return Object.fromEntries((data||[]).map(x=>[x.key,x.value]))}
async function home(){app.innerHTML='<section class="hero"><div id="homeLogo">'+logoHtml('')+'</div><div class="diamond">──── ◈ ────</div><h1 class="title">PROVA DE CONHECIMENTO</h1><div class="sub">LA HERMANDAD RZ7</div><div class="tag">Sistema oficial de avaliação da Hermandad</div><button class="primary" id="candidateBtn">👤 CANDIDATO · COMEÇAR</button><div class="footer">── LA HERMANDAD RZ7 ──<br>© RZ7</div></section>';const btn=document.getElementById('candidateBtn');if(btn)btn.onclick=()=>candidate();try{const s=await getSettings();const logo=s.logo_url?.replace(/^"|"$/g,'')||'';const holder=document.getElementById('homeLogo');if(holder&&logo)holder.innerHTML=logoHtml(logo)}catch(e){console.error(e)}}
async function info(){
const {data}=await sb.from('rz7_information_sections').select('*').eq('enabled',true).order('position');
const sections=(data||[]);
const manual=[
{key:'conduct',title:'⚖️ 1. RESPEITO E CONDUTA',body:`<p>• Respeite todos os membros da RZ7, independentemente do cargo.</p><p>• Respeite a hierarquia e as decisões dos superiores.</p><p>• Não provoque, ofenda ou crie conflitos desnecessários dentro do servidor.</p><p>• Discussões pessoais não devem interferir no funcionamento da RZ7.</p><p>• Mantenha uma postura adequada ao ambiente de RP.</p>`},
{key:'hierarchy',title:'👑 2. HIERARQUIA',body:`<p>• Respeite a cadeia de comando.</p><p>• Ordens de superiores devem ser cumpridas quando forem compatíveis com as regras do servidor/RP.</p><p>• Não utilize seu cargo para intimidar ou prejudicar outros membros.</p><p>• Não peça promoções insistentemente.</p><p>• Promoções são baseadas em desempenho, confiança e avaliação da liderança.</p>`},
{key:'missions',title:'🎯 3. MISSÕES',body:`<p>• Toda missão deve ser executada conforme as instruções recebidas.</p><p>• Leia atentamente o objetivo antes de iniciar uma missão.</p><p>• Erros, descumprimento de ordens ou abandono podem afetar sua avaliação.</p><p>• Não invente informações sobre uma missão concluída.</p><p>• Ao finalizar, informe corretamente o resultado ao responsável.</p>`},
{key:'operations',title:'🔥 4. OPERAÇÕES',body:`<p>• Mantenha comunicação adequada durante operações.</p><p>• Não atrapalhe uma operação deliberadamente.</p><p>• Não divulgue informações internas para pessoas que não possuem autorização.</p><p>• Siga as instruções do responsável pela operação.</p><p>• Evite ações que prejudiquem o RP ou a experiência dos demais jogadores.</p>`},
{key:'internal',title:'🔐 5. INFORMAÇÕES INTERNAS',body:`<p>• Informações internas da RZ7 devem permanecer dentro dos canais apropriados.</p><p>• Não compartilhe prints, mensagens, planos ou decisões internas sem autorização.</p><p>• Não forneça informações estratégicas a pessoas externas à organização.</p>`},
{key:'identity',title:'🎨 6. IDENTIDADE',body:`<p>• Mantenha o padrão visual estabelecido pela RZ7.</p><p>• <b>Cor de cabelo obrigatória: RGB 46, 26, 5.</b></p><p>• O corte ou penteado fica a critério do membro, desde que a cor seja respeitada.</p>`},
{key:'discord',title:'💬 7. DISCORD',body:`<p>• Utilize cada canal para sua finalidade.</p><p>• Não faça spam ou flood.</p><p>• Não abuse de bots, comandos ou outras funcionalidades.</p><p>• Não utilize @everyone ou @here sem autorização.</p><p>• Não envie conteúdo que viole as regras do Discord ou do servidor.</p>`},
{key:'authority',title:'🛡️ 8. AUTORIDADE',body:`<p>• Cargos superiores possuem responsabilidades maiores, não privilégios absolutos.</p><p>• Abuso de autoridade será avaliado pela liderança.</p><p>• Nenhum membro está acima das regras internas.</p><p>• Caso discorde de uma decisão, procure um superior de forma respeitosa.</p>`},
{key:'promotions',title:'📈 9. PROMOÇÕES',body:`<p>A progressão ocorre através de:</p><p>✅ Desempenho</p><p>✅ Disciplina</p><p>✅ Confiança</p><p>✅ Lealdade</p><p>✅ Missões concluídas</p><p>✅ Capacidade de assumir novas responsabilidades</p><p><b>Não existe promoção automática por tempo de permanência.</b></p>`},
{key:'penalties',title:'⚠️ 10. PENALIDADES',body:`<p>O sistema disciplinar considera a gravidade, as provas e a reincidência.</p><p>🟡 <b>1ª advertência:</b> registro formal da infração.</p><p>🟡 <b>2ª advertência:</b> novo registro disciplinar e alerta sobre reincidência.</p><p>🟡 <b>3ª advertência:</b> ao atingir o limite de 3 advertências, ocorre <b>perda de privilégios</b>.</p><p>🟠 <b>Após perda de privilégios:</b> novas infrações podem resultar em <b>rebaixamento</b>.</p><p>⛔ Conforme a gravidade ou reincidência, a situação também poderá resultar em <b>suspensão</b>.</p><p>🚫 Em casos graves ou reincidência extrema, poderá ocorrer <b>expulsão da RZ7</b>.</p><p>A liderança avaliará cada situação individualmente.</p>`},
{key:'command',title:'👑 COMANDO DA RZ7',body:`<p>As regras existem para manter organização, respeito, disciplina e qualidade de RP.</p><p><b>Entre para conquistar confiança.<br>Permaneça para provar seu valor.<br>Suba porque merece.</b></p><p class="quote">“Não buscamos respeito. Nós o conquistamos.”</p>`},
{key:'structure',title:'🎮 HIERARQUIA E EQUIVALÊNCIA NO GAME',body:`<div class="equiv"><div><b>BOSS</b><span>EL PATRÓN</span></div><div><b>UNDERBOSS</b><span>EL PADRINO</span></div><div><b>LIEUTENANT</b><span>IL CONSIGLIERE / EL CAPO / EL LUGARTENIENTE</span></div><div><b>SOLDIER</b><span>EL SOLDATO / EL SICARIO</span></div><div><b>ASSOCIATE</b><span>EL ASOCIADO</span></div><div><b>RECRUIT</b><span>EL RECLUTA / EL ASPIRANTE</span></div></div><p class="muted">Os níveis oficiais do game são: BOSS → UNDERBOSS → LIEUTENANT → SOLDIER → ASSOCIATE → RECRUIT.</p><h3 style="margin-top:22px">📈 PROGRESSÃO RZ7</h3><div class="progression"><span>EL RECLUTA</span><i>→</i><span>EL ASPIRANTE</span><i>→</i><span>EL ASOCIADO</span><i>→</i><span>EL SOLDATO</span><i>→</i><span>EL SICARIO</span><i>→</i><span>EL LUGARTENIENTE</span><i>→</i><span>EL CAPO</span><i>→</i><span>IL CONSIGLIERE</span><i>→</i><span>EL PADRINO</span><i>→</i><span>EL PATRÓN</span></div><p class="muted">A hierarquia interna possui denominações mais específicas, enquanto o game trabalha com os seis níveis oficiais.</p>`}
];
app.innerHTML='<div class="back"><button class="ghost" onclick="go(\'home\')">← VOLTAR AO INÍCIO</button></div>'+
'<header class="manualHeader"><div class="manualKicker">LA HERMANDAD RZ7</div><h1>ℹ️ INFORMAÇÕES RZ7</h1><p>MANUAL OFICIAL DA HERMANDAD</p></header>'+
'<div class="card manualIntro"><h2>MANUAL RZ7</h2><p>Antes de fazer parte da RZ7, leia e compreenda todas as regras. O desconhecimento das regras não isenta ninguém das consequências.</p></div>'+
'<div class="manualSections"><div class="manualButtons">'+manual.map(x=>'<button class="manualBtn" data-manual="'+x.key+'"><span>'+x.title+'</span><small>CLIQUE PARA CONSULTAR</small></button>').join('')+'</div><div id="manualView" class="manualView"></div></div>'+
'<div class="manualFooter">LA HERMANDAD RZ7 · RESPEITO · LEALDADE · HIERARQUIA</div>';
const view=document.getElementById('manualView');
function showManual(key){const x=manual.find(v=>v.key===key);if(!x)return;document.querySelectorAll('.manualBtn').forEach(b=>b.classList.toggle('active',b.dataset.manual===key));view.innerHTML='<article class="card manualSection"><h2>'+x.title+'</h2><div class="manualBody">'+x.body+'</div></article>';view.scrollIntoView({behavior:'smooth',block:'start'})}
document.querySelectorAll('.manualBtn').forEach(b=>b.onclick=()=>showManual(b.dataset.manual));
showManual('conduct');
}
function authCard(kind){return '<div class="card" style="max-width:520px;margin:auto"><div class="sectionTitle"><h1>'+kind+'</h1></div><form id="authForm" class="form"><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha" required><button class="primary">ENTRAR</button></form><div class="actions" style="margin-top:12px"><button class="ghost" id="forgot">🔑 ESQUECI MINHA SENHA</button><button class="ghost" id="register">📝 REGISTRAR-SE</button></div></div>'}
async function candidate(){useAuth('candidate');await loadMe();if(me)return candidateDash();app.innerHTML='<div class="back"><button class="ghost" onclick="go(\'home\')">← VOLTAR</button></div>'+authCard('👤 ACESSO DO CANDIDATO');document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)return toast(error.message);await loadMe();candidateDash()};document.getElementById('forgot').onclick=()=>forgot('candidate');document.getElementById('register').onclick=()=>candidateRegister()}
function candidateRegister(){app.innerHTML='<div class="card" style="max-width:560px;margin:auto"><h1>📝 REGISTRAR-SE</h1><form id="reg" class="form"><input name="name" placeholder="Nome" required><input name="roblox" placeholder="Roblox" required><input name="discord" placeholder="Discord" required><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha" required><input name="confirm" type="password" placeholder="Confirmar senha" required><label><input type="checkbox" name="terms" required> Aceito os termos e as regras da RZ7.</label><button class="primary">CRIAR CONTA</button></form></div>';document.getElementById('reg').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);if(f.get('password')!==f.get('confirm'))return toast('As senhas não coincidem.');const {error}=await sb.auth.signUp({email:f.get('email'),password:f.get('password'),options:{data:{name:f.get('name'),roblox:f.get('roblox'),discord:f.get('discord')}}});if(error)return toast(error.message);toast('Cadastro enviado. Verifique seu e-mail se a confirmação estiver ativada.');candidate()}}
function instructorRegister(){app.innerHTML='<div class="card" style="max-width:560px;margin:auto"><h1>📝 REGISTRAR-SE COMO INSTRUTOR</h1><p class="muted">O cadastro cria uma solicitação. O acesso de instrutor só será liberado após aprovação.</p><form id="ireg" class="form"><input name="name" placeholder="Nome" required><input name="roblox" placeholder="Roblox" required><input name="discord" placeholder="Discord" required><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha" required><input name="confirm" type="password" placeholder="Confirmar senha" required><button class="primary">ENVIAR SOLICITAÇÃO</button></form></div>';document.getElementById('ireg').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);if(f.get('password')!==f.get('confirm'))return toast('As senhas não coincidem.');const {error}=await sb.auth.signUp({email:f.get('email'),password:f.get('password'),options:{data:{name:f.get('name'),roblox:f.get('roblox'),discord:f.get('discord'),registration_type:'instructor'}}});if(error)return toast(error.message);toast('Solicitação enviada. Aguarde a análise da liderança.');go('admin')}}function forgot(kind='candidate'){useAuth(kind);app.innerHTML='<div class="card" style="max-width:520px;margin:auto"><h1>🔑 ESQUECI MINHA SENHA</h1><p class="muted">Digite o e-mail da conta. Você receberá um link para abrir a tela de nova senha.</p><form id="fp" class="form"><input name="email" type="email" placeholder="E-mail" required><button class="primary">ENVIAR LINK</button></form></div>';document.getElementById('fp').onsubmit=async e=>{e.preventDefault();const email=new FormData(e.currentTarget).get('email');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'?reset=1&type='+encodeURIComponent(kind)});if(error)return toast(error.message);toast('Se o e-mail estiver cadastrado, o link de recuperação foi enviado.');}}

async function admin(){useAuth('admin');await loadMe();if(me&&profile&&hasAdminAccess())return adminPanel();app.innerHTML='<div class="back"><button class="ghost" onclick="go(\'home\')">← VOLTAR</button></div>'+authCard('👑 ADMINISTRAÇÃO');document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)return toast(error.message);await loadMe();if(!hasAdminAccess())return toast('Esta conta não possui acesso à Administração.');adminPanel()};document.getElementById('forgot').onclick=()=>forgot('admin');const rb=document.getElementById('register');if(me&&profile?.account_type==='instructor')rb.classList.add('hidden');rb.onclick=()=>instructorRegister()}
function adminPanel(){const nav=[['dashboard','📊 PAINEL',true],['proofs','📝 PROVAS',can('manage_proofs')||can('manage_own_proofs')],['templates','💾 MODELOS',can('manage_templates')],['requests','🛡️ SOLICITAÇÕES',can('manage_instructor_requests')],['punishments','⚠️ PUNIÇÕES',can('apply_punishment')],['permissions','⚙️ CARGOS/PERMISSÕES',can('manage_roles_permissions')],['identity','🖼️ IDENTIDADE',can('manage_identity')],['logs','📜 LOGS',can('view_audit_logs')]];app.innerHTML='<div class="sectionTitle"><h1>👑 '+esc(profile?.account_type==='admin'?'ADMINISTRAÇÃO':'ÁREA DO INSTRUTOR')+'</h1><button class="ghost" id="logout">SAIR</button></div><div class="adminbar">'+nav.filter(x=>x[2]).map(x=>'<button class="ghost gold" data-admin="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><div id="adminContent"></div>';document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();go('home')};document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>adminSection(b.dataset.admin));adminSection('dashboard')}
async function adminSection(x){const c=document.getElementById('adminContent');if(x==='dashboard'){const [{count:proofs},{count:req},{count:attempts}]=await Promise.all([sb.from('rz7_proofs').select('*',{count:'exact',head:true}),sb.from('rz7_instructor_applications').select('*',{count:'exact',head:true}).eq('status','pending'),sb.from('rz7_proof_attempts').select('*',{count:'exact',head:true}).eq('status','in_progress')]);c.innerHTML='<div class="grid"><div class="card"><h3>📝 PROVAS</h3><b>'+proofs+'</b></div><div class="card"><h3>🛡️ SOLICITAÇÕES</h3><b>'+req+'</b></div><div class="card"><h3>👁️ EM ANDAMENTO</h3><b>'+attempts+'</b></div></div><div class="card" style="margin-top:14px"><h3>🔐 Nível de acesso</h3><p class="muted">A interface é filtrada por permissão e o banco aplica RLS. A conta máxima é exclusiva do Administrador Supremo.</p></div>';return}if(x==='proofs')return proofsAdmin(c);if(x==='templates')return templatesAdmin(c);if(x==='requests')return requestsAdmin(c);if(x==='punishments')return punishAdmin(c);if(x==='permissions')return permissionsAdmin(c);if(x==='identity')return identityAdmin(c);if(x==='logs')return logsAdmin(c)}
async function proofsAdmin(c){
  const ownOnly=profile?.account_type==='instructor'&&!can('manage_proofs');
  let query=sb.from('rz7_proofs').select('*').order('created_at',{ascending:false});
  if(ownOnly)query=query.eq('created_by',me.id);
  const {data,error}=await query;
  if(error)return toast(error.message);
  const canResults=can('view_all_results')||can('view_own_results')||supreme;
  c.innerHTML='<div class="sectionTitle"><h2>📝 PROVAS</h2><button class="primary" id="newProof">CRIAR NOVA PROVA</button></div>'+
    '<p class="small muted">'+(ownOnly?'Você está vendo somente as provas criadas por você.':'Você está vendo as provas disponíveis para sua permissão.')+'</p>'+
    '<div class="list">'+(data||[]).map(p=>'<div class="row"><div><b>'+esc(p.code)+' · '+esc(p.name)+'</b><div class="small muted">'+esc(p.status)+' · '+esc(p.visibility)+' · '+Math.round(p.time_limit_seconds/60)+' min</div></div><div class="actions"><button class="ghost" data-open="'+p.id+'">'+(p.status==='open'?'FECHAR':'ABRIR')+'</button><button class="ghost" data-edit="'+p.id+'">EDITAR</button>'+(canResults?'<button class="ghost" data-results="'+p.id+'">RESULTADOS</button>':'')+'</div></div>').join('')+'</div>';
  document.getElementById('newProof').onclick=()=>proofForm();
  c.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.open;
    const {data:p,error:e}=await sb.from('rz7_proofs').select('status').eq('id',id).single();
    if(e)return toast(e.message);
    const st=p.status==='open'?'closed':'open';
    const upd={status:st};
    if(st==='open')upd.opened_at=new Date().toISOString();else upd.closed_at=new Date().toISOString();
    const {error}=await sb.from('rz7_proofs').update(upd).eq('id',id);
    if(error)return toast(error.message);
    proofsAdmin(c)
  });
  c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>proofForm(b.dataset.edit));
  c.querySelectorAll('[data-results]').forEach(b=>b.onclick=()=>proofResults(c,b.dataset.results));
}
async function proofResults(c,pid){
  const {data:p,error:pe}=await sb.from('rz7_proofs').select('id,code,name,status,visibility').eq('id',pid).single();
  if(pe)return toast(pe.message);
  const {data:attempts,error:ae}=await sb.from('rz7_proof_attempts').select('*').eq('proof_id',pid).order('started_at',{ascending:false});
  if(ae)return toast(ae.message);
  const ids=(attempts||[]).map(a=>a.candidate_id).filter(Boolean);
  const {data:profiles,error:profe}=ids.length?await sb.from('rz7_profiles').select('user_id,name,roblox,discord,email').in('user_id',ids):{data:[],error:null};
  if(profe)return toast(profe.message);
  const pm=new Map((profiles||[]).map(x=>[x.user_id,x]));
  const finished=(attempts||[]).filter(a=>a.status!=='in_progress').length;
  const approved=(attempts||[]).filter(a=>a.status==='approved').length;
  c.innerHTML='<div class="sectionTitle"><h2>📊 RESULTADOS · '+esc(p.code)+'</h2><button class="ghost" id="backResults">← VOLTAR ÀS PROVAS</button></div>'+
    '<div class="grid"><div class="card"><h3>👥 PARTICIPANTES</h3><b>'+(attempts||[]).length+'</b></div><div class="card"><h3>✅ CONCLUÍRAM</h3><b>'+finished+'</b></div><div class="card"><h3>🎖️ APROVADOS</h3><b>'+approved+'</b></div></div>'+
    '<div class="card" style="margin-top:14px"><h3>'+esc(p.name)+'</h3><p class="small muted">'+esc(p.status)+' · '+esc(p.visibility)+'</p></div>'+
    '<div class="list">'+((attempts||[]).length?(attempts||[]).map(a=>{
      const u=pm.get(a.candidate_id)||{};
      const time=a.finished_at&&a.started_at?Math.max(0,Math.floor((new Date(a.finished_at)-new Date(a.started_at))/1000)):0;
      const tm=Math.floor(time/60)+':'+String(time%60).padStart(2,'0');
      const status=a.status==='approved'?'🟢 APROVADO':a.status==='failed'?'🔴 REPROVADO':a.status==='failed_timeout'?'⏱️ TEMPO ESGOTADO':'🟡 EM ANDAMENTO';
      return '<div class="row"><div><b>'+esc(u.name||'Candidato')+'</b><div class="small muted">Roblox: '+esc(u.roblox||'—')+' · Discord: '+esc(u.discord||'—')+'</div><div class="small muted">'+status+' · '+(a.score??'—')+'% · '+esc(a.correct_count??0)+' acertos / '+esc(a.wrong_count??0)+' erros · '+tm+'</div></div><button class="ghost" data-detail="'+a.id+'">DETALHES</button></div>'
    }).join(''):'<div class="card"><p>Nenhum candidato iniciou esta prova ainda.</p></div>')+'</div>';
  document.getElementById('backResults').onclick=()=>proofsAdmin(c);
  c.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>attemptDetail(c,pid,b.dataset.detail));
}
async function attemptDetail(c,pid,aid){
  const {data:a,error:ae}=await sb.from('rz7_proof_attempts').select('*').eq('id',aid).single();
  if(ae)return toast(ae.message);
  const {data:p}=await sb.from('rz7_proofs').select('code,name').eq('id',pid).single();
  const {data:u}=await sb.from('rz7_profiles').select('name,roblox,discord,email').eq('user_id',a.candidate_id).maybeSingle();
  const {data:q,error:qe}=await sb.from('rz7_proof_questions').select('id,position,question,points').eq('proof_id',pid).order('position');
  if(qe)return toast(qe.message);
  const qids=(q||[]).map(x=>x.id);
  const {data:o}=qids.length?await sb.from('rz7_proof_options').select('id,question_id,position,label').in('question_id',qids):{data:[]};
  const {data:ca}=qids.length?await sb.from('rz7_proof_correct_answers').select('question_id,option_id').in('question_id',qids):{data:[]};
  const {data:aa}=await sb.from('rz7_attempt_answers').select('question_id,selected_option_id').eq('attempt_id',aid);
  const am=new Map((aa||[]).map(x=>[x.question_id,x.selected_option_id]));
  const cm=new Map((ca||[]).map(x=>[x.question_id,x.option_id]));
  const om=new Map((o||[]).map(x=>[x.id,x.label]));
  const status=a.status==='approved'?'🟢 APROVADO':a.status==='failed'?'🔴 REPROVADO':a.status==='failed_timeout'?'⏱️ TEMPO ESGOTADO':'🟡 EM ANDAMENTO';
  c.innerHTML='<div class="sectionTitle"><h2>🔎 DETALHES DO RESULTADO</h2><button class="ghost" id="backAttempt">← VOLTAR</button></div>'+
    '<div class="card"><h3>'+esc(u?.name||'Candidato')+'</h3><p class="small muted">Roblox: '+esc(u?.roblox||'—')+' · Discord: '+esc(u?.discord||'—')+' · E-mail: '+esc(u?.email||'—')+'</p><p><b>'+esc(p?.code||'')+' · '+esc(p?.name||'')+'</b><br>'+status+' · Nota: '+esc(a.score??'—')+'% · '+esc(a.correct_count??0)+' acertos · '+esc(a.wrong_count??0)+' erros</p></div>'+
    '<div class="list">'+(q||[]).map((qq,i)=>{
      const selected=am.get(qq.id),correct=cm.get(qq.id);
      return '<div class="card"><b>Questão '+(i+1)+': '+esc(qq.question)+'</b><div class="small muted" style="margin-top:8px">Resposta do candidato: <b>'+esc(om.get(selected)||'Não respondida')+'</b><br>Resposta correta: <b>'+esc(om.get(correct)||'—')+'</b></div></div>'
    }).join('')+'</div>';
  document.getElementById('backAttempt').onclick=()=>proofResults(c,pid);
}
async function proofForm(id=null){
let p=null,questions=[];
if(id){
  const r=await sb.from('rz7_proofs').select('*').eq('id',id).single();p=r.data;
  const qr=await sb.from('rz7_proof_questions').select('id,position,question,points').eq('proof_id',id).order('position');
  const ids=(qr.data||[]).map(x=>x.id);
  const or=ids.length?await sb.from('rz7_proof_options').select('id,question_id,position,label').in('question_id',ids):{data:[]};
  const cr=ids.length?await sb.from('rz7_proof_correct_answers').select('question_id,option_id').in('question_id',ids):{data:[]};
  questions=(qr.data||[]).map(q=>({...q,rz7_proof_options:(or.data||[]).filter(o=>o.question_id===q.id).sort((a,b)=>a.position-b.position).map(o=>({...o,is_correct:(cr.data||[]).some(x=>x.question_id===q.id&&x.option_id===o.id)}))}));
}
const latest=(await sb.from('rz7_proofs').select('number').order('number',{ascending:false}).limit(1)).data?.[0]?.number||0;
const next=p?.number||latest+1,code=p?.code||('RZ7-'+String(next).padStart(3,'0'));
const allowId=!!(p&&supreme);
let initialQuestions=questions.length?questions.map(q=>({question:q.question,points:q.points||1,options:(q.rz7_proof_options||[]).map(o=>({label:o.label,is_correct:!!o.is_correct}))})):[{question:'',points:1,options:[{label:'A',is_correct:true},{label:'B',is_correct:false}]}];

document.getElementById('adminContent').innerHTML='<div class="card"><h2>📝 '+(p?'EDITAR PROVA':'CRIAR PROVA')+'</h2><form id="pf" class="form">'+
'<label>Número da prova</label><input name="number" type="number" value="'+next+'" '+(p&&!allowId?'readonly':'')+'>'+
'<label>Código da prova</label><input name="code" value="'+esc(code)+'" '+(p&&!allowId?'readonly':'')+'>'+
'<input name="name" value="'+esc(p?.name||'')+'" placeholder="Nome da prova" required>'+
'<textarea name="description" placeholder="Descrição">'+esc(p?.description||'')+'</textarea>'+
'<label>⏱️ Tempo limite (segundos)</label><input name="time" type="number" min="1" max="2592000" value="'+(p?.time_limit_seconds||1800)+'" placeholder="Ex.: 1800 = 30 minutos" required>'+
'<input name="limit" type="number" min="1" value="'+(p?.participant_limit||'')+'" placeholder="Limite de participantes (vazio = sem limite)">'+
'<select name="visibility"><option value="public" '+(p?.visibility!=='private'?'selected':'')+'>Pública</option><option value="private" '+(p?.visibility==='private'?'selected':'')+'>Privada</option></select>'+
'<div class="sectionTitle" style="margin-top:18px"><h3>❓ QUESTÕES</h3><button type="button" class="ghost" id="addQuestion">＋ ADICIONAR QUESTÃO</button></div>'+
'<div id="questionBuilder"></div>'+
'<p class="small muted">As perguntas, alternativas e respostas corretas são convertidas para o formato interno automaticamente. Você não precisa escrever JSON.</p>'+
'<button class="primary">💾 '+(p?'SALVAR ALTERAÇÕES':'CRIAR PROVA')+'</button></form></div>';

const qb=document.getElementById('questionBuilder');
function letter(i){return String.fromCharCode(65+i)}
function renderQuestions(){
 qb.innerHTML=initialQuestions.map((q,qi)=>'<div class="card questionCard" data-q="'+qi+'" style="margin-top:12px">'+
 '<div class="sectionTitle"><h3>QUESTÃO '+(qi+1)+'</h3><button type="button" class="ghost danger" data-remove-q="'+qi+'">✕ REMOVER</button></div>'+
 '<textarea data-field="question" placeholder="Digite a pergunta..." required>'+esc(q.question||'')+'</textarea>'+
 '<input data-field="points" type="number" min="1" value="'+Number(q.points||1)+'" placeholder="Pontos">'+
 '<div class="small muted" style="margin:8px 0">ALTERNATIVAS — marque uma como correta</div>'+
 '<div class="options">'+q.options.map((o,oi)=>'<div class="actions optionRow" data-option="'+oi+'" style="margin:6px 0"><input data-field="correct" type="radio" name="correct_'+qi+'" '+(o.is_correct?'checked':'')+'><input data-field="label" value="'+esc(o.label||letter(oi))+'" placeholder="Alternativa '+letter(oi)+'" style="flex:1" required><button type="button" class="ghost danger" data-remove-o="'+qi+','+oi+'">✕</button></div>').join('')+'</div>'+
 '<button type="button" class="ghost" data-add-o="'+qi+'">＋ ADICIONAR ALTERNATIVA</button></div>').join('');
}
function syncFromDom(){
 initialQuestions=Array.from(qb.querySelectorAll('.questionCard')).map(card=>({question:card.querySelector('[data-field="question"]').value,points:Number(card.querySelector('[data-field="points"]').value)||1,options:Array.from(card.querySelectorAll('.optionRow')).map((row)=>({label:row.querySelector('[data-field="label"]').value,is_correct:row.querySelector('[data-field="correct"]').checked}))}));
}
renderQuestions();
document.getElementById('addQuestion').onclick=()=>{syncFromDom();initialQuestions.push({question:'',points:1,options:[{label:'A',is_correct:true},{label:'B',is_correct:false}]});renderQuestions()};
qb.onclick=e=>{
const rmq=e.target.closest('[data-remove-q]');if(rmq){syncFromDom();initialQuestions.splice(Number(rmq.dataset.removeQ),1);if(!initialQuestions.length)initialQuestions.push({question:'',points:1,options:[{label:'A',is_correct:true},{label:'B',is_correct:false}]});renderQuestions();return}
const rmo=e.target.closest('[data-remove-o]');if(rmo){syncFromDom();const [qi,oi]=rmo.dataset.removeO.split(',').map(Number);if(initialQuestions[qi].options.length<=2)return toast('Cada questão precisa ter pelo menos 2 alternativas.');initialQuestions[qi].options.splice(oi,1);if(!initialQuestions[qi].options.some(o=>o.is_correct))initialQuestions[qi].options[0].is_correct=true;initialQuestions[qi].options.forEach((o,i)=>{if(!o.label||/^Alternativa /.test(o.label))o.label=letter(i)});renderQuestions();return}
const addo=e.target.closest('[data-add-o]');if(addo){syncFromDom();const qi=Number(addo.dataset.addO);if(initialQuestions[qi].options.length>=6)return toast('Máximo de 6 alternativas por questão.');initialQuestions[qi].options.push({label:letter(initialQuestions[qi].options.length),is_correct:false});renderQuestions()}
};
document.getElementById('pf').onsubmit=async e=>{
e.preventDefault();syncFromDom();
if(!initialQuestions.length)return toast('Adicione pelo menos uma questão.');
for(const q of initialQuestions){if(!q.question.trim())return toast('Preencha todas as perguntas.');if(q.options.length<2)return toast('Cada questão precisa ter pelo menos 2 alternativas.');if(!q.options.some(o=>o.is_correct))return toast('Marque a resposta correta de cada questão.');if(q.options.some(o=>!o.label.trim()))return toast('Preencha todas as alternativas.')}
const f=new FormData(e.currentTarget),seconds=Number(f.get('time'));
if(!Number.isInteger(seconds)||seconds<1||seconds>2592000)return toast('O tempo deve estar entre 1 e 2.592.000 segundos (30 dias).');
const payload={name:f.get('name'),description:f.get('description'),time_limit_seconds:seconds,participant_limit:f.get('limit')?Number(f.get('limit')):null,visibility:f.get('visibility')};
if(p){
 let r;if(allowId)r=await sb.from('rz7_proofs').update({number:Number(f.get('number')),code:f.get('code'),...payload}).eq('id',p.id);else r=await sb.from('rz7_proofs').update(payload).eq('id',p.id);
 if(r.error)return toast(r.error.message);
 const {error:qerr}=await sb.rpc('rz7_replace_proof_questions',{p_proof:p.id,p_questions:initialQuestions});if(qerr)return toast(qerr.message);
}else{
 const {data:np,error:r}=await sb.from('rz7_proofs').insert({number:Number(f.get('number')),code:f.get('code'),...payload,created_by:me.id}).select().single();
 if(r)return toast(r.message);
 const {error:qerr}=await sb.rpc('rz7_replace_proof_questions',{p_proof:np.id,p_questions:initialQuestions});if(qerr)return toast(qerr.message);
}
toast('Prova salva.');adminSection('proofs')
}
}async function templatesAdmin(c){const {data}=await sb.from('rz7_proof_templates').select('*').order('created_at',{ascending:false});c.innerHTML='<div class="sectionTitle"><h2>💾 MODELOS</h2><button class="primary" id="nt">NOVO MODELO</button></div><div class="list">'+(data||[]).map(t=>'<div class="row"><div><b>'+esc(t.name)+'</b><div class="small muted">'+esc(t.description||'')+'</div></div><button class="ghost" data-use="'+t.id+'">USAR MODELO</button></div>').join('')+'</div>';document.getElementById('nt').onclick=()=>templateForm();c.querySelectorAll('[data-use]').forEach(b=>b.onclick=async()=>{const {data:t}=await sb.from('rz7_proof_templates').select('*').eq('id',b.dataset.use).single();const n=(await sb.from('rz7_proofs').select('number').order('number',{ascending:false}).limit(1)).data?.[0]?.number+1||1;const {data:p,error}=await sb.from('rz7_proofs').insert({number:n,code:'RZ7-'+String(n).padStart(3,'0'),name:t.name,description:t.description,time_limit_seconds:t.time_limit_seconds,participant_limit:t.participant_limit,visibility:t.visibility,created_by:me.id,template_id:t.id}).select().single();if(error)return toast(error.message);const {error:qerr}=await sb.rpc('rz7_replace_proof_questions',{p_proof:p.id,p_questions:t.questions||[]});if(qerr)return toast(qerr.message);toast('Nova prova criada a partir do modelo.');adminSection('proofs')})}
function templateForm(){document.getElementById('adminContent').innerHTML='<div class="card"><h2>💾 NOVO MODELO</h2><form id="tf" class="form"><input name="name" placeholder="Nome do modelo" required><textarea name="description" placeholder="Descrição"></textarea><input name="time" type="number" min="1" value="30" placeholder="Tempo em minutos"><input name="limit" type="number" min="1" placeholder="Limite de participantes"><select name="visibility"><option value="public">Pública</option><option value="private">Privada</option></select><textarea name="questions" placeholder=\'JSON de perguntas. Ex.: [{"question":"Pergunta?","options":[{"label":"A","is_correct":true},{"label":"B","is_correct":false}]}]\'></textarea><button class="primary">SALVAR MODELO</button></form></div>';document.getElementById('tf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);let q=[];try{q=f.get('questions')?JSON.parse(f.get('questions')):[]}catch{return toast('JSON inválido.')}const {error}=await sb.from('rz7_proof_templates').insert({name:f.get('name'),description:f.get('description'),time_limit_seconds:Number(f.get('time'))*60,participant_limit:f.get('limit')?Number(f.get('limit')):null,visibility:f.get('visibility'),questions:q,created_by:me.id});if(error)return toast(error.message);adminSection('templates')}}
async function requestsAdmin(c){const {data}=await sb.from('rz7_instructor_applications').select('*').order('created_at',{ascending:false});c.innerHTML='<h2>🛡️ SOLICITAÇÕES DE INSTRUTOR</h2><div class="list">'+(data||[]).map(a=>'<div class="card"><b>'+esc(a.name)+'</b><div class="muted">'+esc(a.roblox)+' · '+esc(a.discord)+' · '+esc(a.email)+'</div><div class="pill">'+esc(a.status)+'</div>'+(a.status==='pending'?'<div class="actions" style="margin-top:10px"><button class="primary" data-ap="'+a.id+'">ACEITAR</button><button class="ghost danger" data-den="'+a.id+'">NEGAR</button><button class="ghost danger" data-pun="'+a.user_id+'">PUNIR</button></div>':'')+'</div>').join('')+'</div>';c.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>reviewApp(b.dataset.ap,true));c.querySelectorAll('[data-den]').forEach(b=>b.onclick=()=>reviewApp(b.dataset.den,false));c.querySelectorAll('[data-pun]').forEach(b=>b.onclick=()=>punishForm(b.dataset.pun))}
async function reviewApp(id,approve){const reason=prompt(approve?'Observação (opcional):':'Motivo da negativa:','');const {error}=await sb.rpc('rz7_review_instructor_application',{p_application:id,p_approve:approve,p_reason:reason});if(error)return toast(error.message);adminSection('requests')}
function punishForm(uid){document.getElementById('adminContent').innerHTML='<div class="card"><h2>⚠️ APLICAR PUNIÇÃO</h2><form id="pun" class="form"><input name="uid" value="'+esc(uid)+'" readonly><select name="type"><option value="warning">⚠️ Advertência</option><option value="instructor_request_block">🚫 Bloqueio de solicitação de instrutor</option><option value="proof_block">🔒 Bloqueio de provas</option><option value="suspension">⏱️ Suspensão</option><option value="permanent_proof_block">🔴 Bloqueio permanente de provas</option><option value="permanent_total_block">🔴 Bloqueio permanente total</option></select><textarea name="reason" placeholder="Motivo" required></textarea><input name="duration" type="number" min="1" max="2592000" value="86400" placeholder="Duração em segundos"><p class="small muted">Temporárias: duração em segundos, máximo 30 dias. Punições permanentes e o bloqueio total são exclusivos do Administrador Supremo.</p><button class="primary">APLICAR</button></form></div>';document.getElementById('pun').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),type=f.get('type'),permanent=type.startsWith('permanent_');const duration=permanent?null:Number(f.get('duration'));if(!permanent&&duration>2592000)return toast('Máximo de 30 dias.');if(permanent&&profile?.account_type!=='admin')return toast('Acesso negado.');if(type==='permanent_total_block'){if(profile?.account_type!=='admin')return toast('Somente o Administrador Supremo.');const {error}=await sb.functions.invoke('rz7-account-action',{body:{action:'permanent_total_block',user_id:f.get('uid')}});if(error)return toast(error.message);const {error:pe}=await sb.from('rz7_punishments').insert({user_id:f.get('uid'),type,reason:f.get('reason'),permanent:true,applied_by:me.id});if(pe)return toast(pe.message);toast('Bloqueio permanente total aplicado.');return adminSection('punishments')}const {error}=await sb.from('rz7_punishments').insert({user_id:f.get('uid'),type,reason:f.get('reason'),duration_seconds:duration,expires_at:permanent?null:new Date(Date.now()+duration*1000).toISOString(),permanent,applied_by:me.id});if(error)return toast(error.message);toast('Punição registrada.');adminSection('punishments')}}async function punishAdmin(c){const {data}=await sb.from('rz7_punishments').select('*').order('created_at',{ascending:false});c.innerHTML='<div class="sectionTitle"><h2>⚠️ PUNIÇÕES</h2></div><div class="list">'+(data||[]).map(p=>'<div class="row"><div><b>'+esc(p.type)+'</b><div class="small muted">Usuário: '+esc(p.user_id)+' · '+esc(p.reason)+'</div></div><span class="pill '+(p.permanent?'bad':'')+'">'+(p.permanent?'PERMANENTE':(p.expires_at?new Date(p.expires_at).toLocaleString('pt-BR'):'—'))+'</span></div>').join('')+'</div>'}
async function permissionsAdmin(c){
  const {data,error}=await sb.from('rz7_profiles').select('user_id,name,email,account_type,account_status,role_id').in('account_type',['instructor','admin']).eq('account_status','active').order('created_at');
  if(error)return toast(error.message);
  const {data:roles}=await sb.from('rz7_roles').select('*').order('level',{ascending:false});
  c.innerHTML='<h2>⚙️ CARGOS E PERMISSÕES</h2><p class="small muted">Aqui aparecem somente contas administrativas ativas e instrutores que já foram aprovados pela liderança.</p><div class="list">'+
    (data||[]).map(u=>'<div class="row"><div><b>'+esc(u.name||u.email)+'</b><div class="small muted">'+(u.account_type==='instructor'?'🛡️ INSTRUTOR':'👑 ADMINISTRADOR')+' · '+esc(u.account_status)+'</div></div><div class="actions"><select data-user="'+u.user_id+'">'+(roles||[]).map(r=>'<option value="'+r.id+'" '+(r.id===u.role_id?'selected':'')+'>'+esc(r.name)+'</option>').join('')+'</select><button class="ghost" data-perm="'+u.user_id+'">PERMISSÕES</button>'+(supreme&&u.user_id!==me.id?'<button class="ghost danger" data-delete="'+u.user_id+'">EXCLUIR</button>':'')+'</div></div>').join('')+
    '</div><p class="small muted">Solicitações pendentes ou negadas não aparecem aqui e não recebem acesso à Administração.</p>';
  c.querySelectorAll('[data-user]').forEach(s=>s.onchange=async()=>{const {error}=await sb.rpc('rz7_set_user_role',{p_user:s.dataset.user,p_role:s.value});if(error){toast(error.message);permissionsAdmin(c)}});
  c.querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>userPermissionEditor(b.dataset.perm));
  c.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir esta conta permanentemente?'))return;const {error}=await sb.functions.invoke('rz7-account-action',{body:{action:'delete',user_id:b.dataset.delete}});if(error)return toast(error.message);toast('Conta excluída.');permissionsAdmin(c)})
}
async function userPermissionEditor(uid){const {data:ps}=await sb.from('rz7_permissions').select('*').order('critical',{ascending:false});const {data:ups}=await sb.from('rz7_user_permissions').select('permission_id,allowed').eq('user_id',uid);const map=new Map((ups||[]).map(x=>[x.permission_id,x.allowed]));document.getElementById('adminContent').innerHTML='<div class="card"><div class="sectionTitle"><h2>⚙️ PERMISSÕES INDIVIDUAIS</h2><button class="ghost" id="backPerm">← VOLTAR</button></div><p class="muted">O cargo fornece permissões padrão. Aqui ficam os overrides individuais. Permissões críticas só podem ser alteradas pelo Administrador Supremo.</p><div class="list">'+(ps||[]).map(p=>'<label class="row"><span><b>'+esc(p.name)+'</b><div class="small muted">'+esc(p.description||'')+(p.critical?' · 🔴 CRÍTICA':'')+'</div></span><input type="checkbox" data-pid="'+p.id+'" '+(map.get(p.id)===true?'checked':'')+' '+(p.critical&&!supreme?'disabled':'')+'></label>').join('')+'</div></div>';document.getElementById('backPerm').onclick=()=>adminSection('permissions');document.querySelectorAll('[data-pid]').forEach(cb=>cb.onchange=async()=>{const pid=cb.dataset.pid;if(!supreme&&ps.find(p=>p.id===pid)?.critical){cb.checked=!cb.checked;return toast('Somente o Administrador Supremo pode alterar esta permissão.')}const {error}=await sb.from('rz7_user_permissions').upsert({user_id:uid,permission_id:pid,allowed:cb.checked,updated_at:new Date().toISOString()},{onConflict:'user_id,permission_id'});if(error)toast(error.message)})}async function identityAdmin(c){const s=await getSettings();const logo=s.logo_url?.replace(/^"|"$/g,'')||'';c.innerHTML='<div class="card"><h2>🖼️ IDENTIDADE RZ7</h2><form id="idform" class="form"><input name="logo" value="'+esc(logo)+'" placeholder="URL da logo"><input name="hair" value="rgb(46, 26, 5)" placeholder="Cor do cabelo"><button class="primary">SALVAR IDENTIDADE</button></form><p class="small muted">A logo é carregada por URL nesta primeira versão; a configuração fica protegida pela permissão de identidade.</p></div>';document.getElementById('idform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);for(const [key,value] of [['logo_url',JSON.stringify(f.get('logo'))],['hair_color',JSON.stringify(f.get('hair'))]]){const {error}=await sb.from('rz7_system_settings').upsert({key,value:JSON.parse(value),updated_by:me.id,updated_at:new Date().toISOString()});if(error)return toast(error.message)}toast('Identidade salva.');home()}}
async function logsAdmin(c){const {data}=await sb.from('rz7_audit_logs').select('*').order('created_at',{ascending:false}).limit(100);c.innerHTML='<h2>📜 LOGS</h2><div class="list">'+(data||[]).map(x=>'<div class="row"><div><b>'+esc(x.action)+'</b><div class="small muted">'+esc(x.entity_type||'')+' · '+esc(x.entity_id||'')+'</div></div><span class="small muted">'+new Date(x.created_at).toLocaleString('pt-BR')+'</span></div>').join('')+'</div>'}
async function candidateDash(){await loadMe();if(!profile)return candidate();if(profile.account_status==='blocked_permanently'){app.innerHTML='<div class="card"><h1>🔴 CONTA BLOQUEADA</h1><p>Esta conta está bloqueada permanentemente e não pode acessar provas ou registrar novas atividades.</p></div>';return}const {data:proofs}=await sb.from('rz7_proofs').select('*').eq('status','open').order('number');const {data:attempts}=await sb.from('rz7_proof_attempts').select('*').eq('candidate_id',me.id);const done=new Set((attempts||[]).map(a=>a.proof_id));app.innerHTML='<div class="sectionTitle"><h1>👤 PAINEL DO CANDIDATO</h1><button class="ghost" id="out">SAIR</button></div><div class="card"><h3>Meu cadastro</h3><p>'+esc(profile.name)+'<br>'+esc(profile.roblox)+' · '+esc(profile.discord)+'</p></div><div class="card" style="margin-top:14px"><h2>📝 PROVAS DISPONÍVEIS</h2><div class="list">'+(proofs||[]).map(p=>'<div class="row"><div><b>'+esc(p.code)+' · '+esc(p.name)+'</b><div class="small muted">'+(p.visibility==='private'?'🔒 Privada':'🌐 Pública')+' · '+Math.round(p.time_limit_seconds/60)+' min</div></div><button class="primary" data-start="'+p.id+'" '+(done.has(p.id)?'disabled':'')+'>'+(done.has(p.id)?'JÁ REALIZADA':(p.visibility==='private'?'SOLICITAR/INICIAR':'INICIAR PROVA'))+'</button></div>').join('')+'</div></div><div class="card" style="margin-top:14px"><h2>📊 MEUS RESULTADOS</h2><div class="list">'+(attempts||[]).map(a=>'<div class="row"><div><b>'+esc(a.status)+'</b><div class="small muted">'+esc(a.result_note||'')+'</div></div><span>'+esc(a.score??'—')+'%</span></div>').join('')+'</div></div>';document.getElementById('out').onclick=async()=>{await sb.auth.signOut();go('home')};app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startOrRequest(b.dataset.start))}
async function startOrRequest(id){const {data:p}=await sb.from('rz7_proofs').select('*').eq('id',id).single();if(p.visibility==='private'){const {data:r}=await sb.from('rz7_proof_access_requests').select('*').eq('proof_id',id).eq('candidate_id',me.id).maybeSingle();if(!r){const {error}=await sb.from('rz7_proof_access_requests').insert({proof_id:id,candidate_id:me.id});if(error)return toast(error.message);return toast('Solicitação enviada. Aguarde autorização do instrutor.')}if(r.status!=='approved')return toast(r.status==='pending'?'Aguardando autorização.':'Solicitação negada.')}const {data,error}=await sb.rpc('rz7_start_proof',{p_proof:id});if(error)return toast(error.message);currentAttempt=data;takeProof(id,data)}
async function takeProof(pid,aid){const {data:q}=await sb.from('rz7_proof_questions').select('id,position,question,points').eq('proof_id',pid).order('position');const {data:o}=await sb.from('rz7_proof_options').select('id,question_id,position,label').in('question_id',(q||[]).map(x=>x.id));const questions=(q||[]).map(x=>({...x,rz7_proof_options:(o||[]).filter(y=>y.question_id===x.id)}));let idx=0,answers={};function render(){const qq=questions[idx];const remain=questions.length?Math.round((idx/questions.length)*100):0;app.innerHTML='<div class="sectionTitle"><h1>📝 PROVA</h1><span id="clock" class="pill"></span></div><div class="progress"><i style="width:'+remain+'%"></i></div><div class="card question"><div class="small muted">Questão '+(idx+1)+' de '+questions.length+'</div><h2>'+esc(qq.question)+'</h2><div>'+qq.rz7_proof_options.map(o=>'<button class="option '+(answers[qq.id]===o.id?'selected':'')+'" data-o="'+o.id+'">'+esc(o.label)+'</button>').join('')+'</div><div class="actions" style="margin-top:14px">'+(idx?'<button class="ghost" id="prev">← ANTERIOR</button>':'')+(idx<questions.length-1?'<button class="primary" id="next">PRÓXIMA →</button>':'<button class="primary" id="finish">FINALIZAR PROVA</button>')+'</div></div>';app.querySelectorAll('[data-o]').forEach(b=>b.onclick=async()=>{answers[qq.id]=b.dataset.o;const {error}=await sb.rpc('rz7_save_answer',{p_attempt:aid,p_question:qq.id,p_option:b.dataset.o});if(error)return toast(error.message);render()});if(document.getElementById('prev'))document.getElementById('prev').onclick=()=>{idx--;render()};if(document.getElementById('next'))document.getElementById('next').onclick=()=>{if(!answers[qq.id])return toast('Selecione uma alternativa.');idx++;render()};if(document.getElementById('finish'))document.getElementById('finish').onclick=finish;updateClock()}function updateClock(){clearInterval(timer);const tick=async()=>{const {data:a}=await sb.from('rz7_proof_attempts').select('started_at,time_limit_seconds,status').eq('id',aid).single();if(!a)return;const left=Math.max(0,Math.floor((new Date(a.started_at).getTime()+a.time_limit_seconds*1000-Date.now())/1000));const clock=document.getElementById('clock');if(clock)clock.textContent='⏱️ '+Math.floor(left/60).toString().padStart(2,'0')+':'+(left%60).toString().padStart(2,'0');if(left<=0){clearInterval(timer);await sb.rpc('rz7_finish_proof',{p_attempt:aid});return showResult(aid)}};tick();timer=setInterval(tick,1000)}async function finish(){if(!confirm('Tem certeza que deseja finalizar a prova?'))return;clearInterval(timer);const {error}=await sb.rpc('rz7_finish_proof',{p_attempt:aid});if(error)return toast(error.message);showResult(aid)}render()}async function showResult(aid){const {data:a}=await sb.from('rz7_proof_attempts').select('*,rz7_proofs(code,name)').eq('id',aid).single();const approved=a.status==='approved',timeout=a.status==='failed_timeout';let desc=approved?'Parabéns, [NOME]. Você foi APROVADO na prova de conhecimento da La Hermandad RZ7.<br><br>Mas isso é apenas o começo. A partir de agora, você deverá realizar o Teste Oficial dentro do RP, onde será avaliado em situação real.<br><br>Após sua aprovação no teste, seguirá o Batismo da Hermandad — o momento em que sua entrada será oficialmente reconhecida.<br><br>Prepare-se. A partir daqui, você deixa de apenas conhecer a Hermandad... e começa a fazer parte dela. 🐺':timeout?'[NOME], sua avaliação foi encerrada porque o tempo destinado à prova chegou ao fim. Sua tentativa foi registrada como REPROVADA POR TEMPO.<br><br>Prepare-se melhor para uma próxima oportunidade. A Hermandad reconhece quem persiste. 🐺':'[NOME], sua avaliação foi concluída. Infelizmente, você NÃO FOI APROVADO na prova de conhecimento da La Hermandad RZ7.<br><br>Neste momento, você não poderá avançar para o Teste Oficial dentro do RP.<br><br>Estude, observe e esteja preparado. Uma segunda oportunidade poderá ser concedida pela liderança.<br><br>A Hermandad reconhece quem persiste. 🐺';desc=desc.replaceAll('[NOME]',esc(profile?.name||'candidato'));app.innerHTML='<div class="result"><div class="resultbox"><pre>╔══════════════════════════════╗\n║       RESULTADO DA PROVA     ║\n╠══════════════════════════════╣\n║ Prova: '+a.rz7_proofs.code+'\n║                              ║\n║ Questões: '+a.total_questions+'\n║ Acertos: '+a.correct_count+'\n║ Erros: '+a.wrong_count+'\n║                              ║\n║ Nota: '+a.score+'%\n║                              ║\n║ '+(approved?'🟢 APROVADO': '🔴 REPROVADO')+'\n║                              ║\n║ Tempo utilizado: '+Math.floor((new Date(a.finished_at)-new Date(a.started_at))/60000)+':'+String(Math.floor(((new Date(a.finished_at)-new Date(a.started_at))/1000)%60)).padStart(2,'0')+'\n╚══════════════════════════════╝</pre></div><div class="card"><h2>'+(approved?'🎖️':'❌')+' PROVA CONCLUÍDA</h2><p>'+desc+'</p></div><button class="primary" onclick="candidateDash()">VOLTAR AO PAINEL</button></div>'}
window.go=async x=>{if(x==='home')return home();if(x==='info')return info();if(x==='admin')return admin();if(x==='candidate')return candidate()};
function bindAuth(client,kind){client.auth.onAuthStateChange((e)=>{if(e==='PASSWORD_RECOVERY'){const type=new URLSearchParams(location.search).get('type')||kind;if(type===kind)resetPage(kind)}})}
bindAuth(sbCandidate,'candidate');bindAuth(sbAdmin,'admin');
document.getElementById('candidateBtn').onclick=()=>candidate();(async()=>{const qs=new URLSearchParams(location.search);const reset=qs.get('reset')==='1';if(reset)return resetPage(qs.get('type')==='admin'?'admin':'candidate');try{await home()}catch(e){console.error(e);toast('Não foi possível carregar a página. Recarregue e tente novamente.')}})();
</script>

grid;gap:11px}.form input,.form textarea,.form select{width:100%;background:#090909;border:1px solid #303030;color:var(--text);border-radius:10px;padding:12px;outline:none}.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--gold2)}.form textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap}.hidden{display:none!important}.back{margin-bottom:14px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}.sectionTitle h1{margin:0;font-size:28px}.list{display:grid;gap:10px}.row{background:#0d0d0d;border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:#202020;border:1px solid #333;color:#ddd;font-size:12px}.ok{color:#72d18b}.bad{color:#ff7676}.goldtxt{color:#e4c56c}.menu{position:fixed;inset:0 auto 0 0;width:min(330px,88vw);background:#0a0a0af7;border-right:1px solid #332816;z-index:50;padding:80px 18px 20px;transform:translateX(-105%);transition:.2s}.menu.open{transform:none}.menu button{display:block;width:100%;text-align:left;background:#111;border:1px solid var(--line);color:var(--text);padding:14px;border-radius:11px;margin:8px 0}.overlay{position:fixed;inset:0;background:#0009;z-index:40}.notice{padding:12px;border:1px solid #3c321f;background:#17130a;border-radius:12px;color:#dec77f}.result{max-width:520px;margin:20px auto}.resultbox{border:1px solid #5d4820;border-radius:18px;padding:18px;background:#0b0b0b}.resultbox pre{font:inherit;white-space:pre-wrap}.question{margin:16px 0}.option{display:block;width:100%;text-align:left;background:#0b0b0b;border:1px solid #333;color:var(--text);padding:13px;border-radius:10px;margin:8px 0}.option.selected{border-color:var(--gold);background:#1b160a}.progress{height:8px;background:#202020;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--gold);width:0}.adminbar{display:flex;gap:8px;overflow:auto;margin-bottom:15px;padding-bottom:3px}.adminbar button{white-space:nowrap}.danger{border-color:#693333;color:#ff8b8b}.small{font-size:12px}.footer{text-align:center;color:#777;margin-top:40px;font-size:12px}.manualHeader{text-align:center;margin:10px auto 22px;max-width:820px;padding:24px 10px;border-bottom:1px solid #332816}.manualHeader h1{margin:6px 0;font-size:clamp(28px,7vw,44px);letter-spacing:1px}.manualHeader p,.manualKicker{color:#d7c27d;letter-spacing:3px;font-size:12px}.manualKicker{font-weight:800}.manualIntro{max-width:820px;margin:0 auto 14px;border-color:#5a4520}.manualIntro h2{margin-top:0}.quote{color:#e4c56c;font-style:italic}.manualSections{max-width:820px;margin:auto;display:grid;gap:14px}.manualSection{position:relative;padding-left:54px;max-width:820px;margin:0 auto}.manualSection h2{margin:0 0 12px;font-size:20px}.manualBody{line-height:1.7;color:#ddd9cf}.manualBody p{margin:8px 0}.manualNum{position:absolute;left:17px;top:18px;color:#d7ad42;font-weight:900;font-size:13px}.equiv{display:grid;gap:8px}.equiv div{display:flex;justify-content:space-between;gap:15px;padding:11px 12px;background:#0a0a0a;border:1px solid #292929;border-radius:10px}.equiv b{color:#d7ad42}.equiv span{text-align:right}.progression{display:flex;flex-wrap:wrap;align-items:center;gap:7px;line-height:1.8}.progression span{padding:6px 9px;border:1px solid #3a301d;background:#0a0a0a;border-radius:8px;color:#e8dfc6}.progression i{color:#d7ad42;font-style:normal}.manualFooter{text-align:center;color:#716d64;font-size:11px;letter-spacing:2px;padding:28px 5px 10px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient}=supabase;
const SUPABASE_URL='https://euazdymywhtgunjmztuv.supabase.co';
const SUPABASE_KEY='sb_publishable_XifsKYxSfBB-MITOf9s1Bw_W-5gfXaT';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app'),menu=document.getElementById('menu'),overlay=document.getElementById('overlay');
let me=null, profile=null, perms=new Set(), currentAttempt=null, timer=null, supreme=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const toast=m=>alert(m);
function closeMenu(){menu.classList.remove('open');overlay.classList.add('hidden')}
document.getElementById('menuBtn').onclick=()=>{menu.classList.add('open');overlay.classList.remove('hidden')};overlay.onclick=closeMenu;

function logoHtml(url){return url?'<img class="logo" src="'+esc(url)+'" alt="RZ7">':'<div class="logoFallback">RZ7</div>'}
async function loadMe(){const {data:{user}}=await sb.auth.getUser();me=user||null;if(!me){profile=null;perms=new Set();return}const {data:p}=await sb.from('rz7_profiles').select('*').eq('user_id',me.id).maybeSingle();profile=p||null;supreme=false;if(profile){const {data:rr}=await sb.from('rz7_roles').select('is_supreme').eq('id',profile.role_id).maybeSingle();supreme=!!rr?.is_supreme;const {data:rps}=await sb.from('rz7_role_permissions').select('permission_id,rz7_permissions(key)').eq('role_id',profile.role_id);(rps||[]).forEach(x=>{if(x.rz7_permissions?.key)perms.add(x.rz7_permissions.key)});const {data:ups}=await sb.from('rz7_user_permissions').select('allowed,rz7_permissions(key)').eq('user_id',me.id);(ups||[]).forEach(x=>{if(x.rz7_permissions?.key){if(x.allowed)perms.add(x.rz7_permissions.key);else perms.delete(x.rz7_permissions.key)}})}}
function can(p){return profile?.account_status==='active'&&(supreme || perms.has(p))}
function admin(){return profile?.account_type==='admin'||profile?.account_type==='instructor'}
async function getSettings(){const {data}=await sb.from('rz7_system_settings').select('*');return Object.fromEntries((data||[]).map(x=>[x.key,x.value]))}
async function home(){const s=await getSettings();const logo=s.logo_url?.replace(/^"|"$/g,'')||'';app.innerHTML='<section class="hero">'+logoHtml(logo)+'<div class="diamond">──── ◈ ────</div><h1 class="title">PROVA DE CONHECIMENTO</h1><div class="sub">LA HERMANDAD RZ7</div><div class="tag">Sistema oficial de avaliação da Hermandad</div><button class="primary" id="candidateBtn">👤 CANDIDATO · COMEÇAR</button><div class="footer">── LA HERMANDAD RZ7 ──<br>© RZ7</div></section>';document.getElementById('candidateBtn').onclick=()=>candidate()}
async function info(){
const {data}=await sb.from('rz7_information_sections').select('*').eq('enabled',true).order('position');
const sections=(data||[]);
const sectionHtml=sections.map(x=>'<article class="card manualSection"><div class="manualNum">0'+esc(x.position)+'</div><h2>'+esc(x.title)+'</h2><div class="manualBody">'+esc(x.body).replace(/\n/g,'<br>')+'</div></article>').join('');
app.innerHTML='<div class="back"><button class="ghost" onclick="go(\'home\')">← VOLTAR AO INÍCIO</button></div>'+
'<header class="manualHeader"><div class="manualKicker">LA HERMANDAD RZ7</div><h1>ℹ️ INFORMAÇÕES RZ7</h1><p>MANUAL OFICIAL DA HERMANDAD</p></header>'+
'<div class="manualIntro card"><h2>👑 COMANDO DA RZ7</h2><p><b>EL PATRÓN</b> representa o comando máximo da Hermandad e possui a decisão final sobre a estrutura e administração.</p><p class="quote">“Não buscamos respeito. Nós o conquistamos.”</p></div>'+
'<div class="manualSections">'+sectionHtml+'</div>'+
'<article class="card manualSection"><div class="manualNum">09</div><h2>🎨 IDENTIDADE VISUAL</h2><div class="manualBody"><p><b>Cabelo obrigatório: RGB 46, 26, 5.</b></p><p>O corte e o estilo são livres.</p><p>A identidade visual representa a unidade dos membros e deve ser respeitada nas situações em que o padrão da RZ7 for exigido.</p></div></article>'+
'<article class="card manualSection"><div class="manualNum">10</div><h2>🎮 EQUIVALÊNCIA NO GAME</h2><div class="manualBody"><div class="equiv"><div><b>BOSS</b><span>EL PATRÓN</span></div><div><b>UNDERBOSS</b><span>EL PADRINO</span></div><div><b>LIEUTENANT</b><span>IL CONSIGLIERE / EL CAPO / EL LUGARTENIENTE</span></div><div><b>SOLDIER</b><span>EL SOLDATO / EL SICARIO</span></div><div><b>ASSOCIATE</b><span>EL ASOCIADO</span></div><div><b>RECRUIT</b><span>EL RECLUTA / EL ASPIRANTE</span></div></div><p class="muted">Os níveis oficiais do game são: BOSS → UNDERBOSS → LIEUTENANT → SOLDIER → ASSOCIATE → RECRUIT.</p></div></article>'+
'<article class="card manualSection"><div class="manualNum">11</div><h2>📈 PROGRESSÃO RZ7</h2><div class="manualBody"><div class="progression"><span>EL RECLUTA</span><i>→</i><span>EL ASPIRANTE</span><i>→</i><span>EL ASOCIADO</span><i>→</i><span>EL SOLDATO</span><i>→</i><span>EL SICARIO</span><i>→</i><span>EL LUGARTENIENTE</span><i>→</i><span>EL CAPO</span><i>→</i><span>IL CONSIGLIERE</span><i>→</i><span>EL PADRINO</span><i>→</i><span>EL PATRÓN</span></div><p class="muted">A hierarquia interna possui denominações mais específicas, enquanto o game trabalha com os seis níveis oficiais.</p></div></article>'+
'<div class="manualFooter">LA HERMANDAD RZ7 · RESPEITO · LEALDADE · HIERARQUIA</div>';
}
function authCard(kind){return '<div class="card" style="max-width:520px;margin:auto"><div class="sectionTitle"><h1>'+kind+'</h1></div><form id="authForm" class="form"><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha" required><button class="primary">ENTRAR</button></form><div class="actions" style="margin-top:12px"><button class="ghost" id="forgot">🔑 ESQUECI MINHA SENHA</button><button class="ghost" id="register">📝 REGISTRAR-SE</button></div></div>'}
async function candidate(){if(me){await loadMe();return candidateDash()}app.innerHTML='<div class="back"><button class="ghost" onclick="go(\'home\')">← VOLTAR</button></div>'+authCard('👤 ACESSO DO CANDIDATO');document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)return toast(error.message);await loadMe();candidateDash()};document.getElementById('forgot').onclick=()=>forgot('candidate');document.getElementById('register').onclick=()=>candidateRegister()}
function candidateRegister(){app.innerHTML='<div class="card" style="max-width:560px;margin:auto"><h1>📝 REGISTRAR-SE</h1><form id="reg" class="form"><input name="name" placeholder="Nome" required><input name="roblox" placeholder="Roblox" required><input name="discord" placeholder="Discord" required><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha" required><input name="confirm" type="password" placeholder="Confirmar senha" required><label><input type="checkbox" name="terms" required> Aceito os termos e as regras da RZ7.</label><button class="primary">CRIAR CONTA</button></form></div>';document.getElementById('reg').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);if(f.get('password')!==f.get('confirm'))return toast('As senhas não coincidem.');const {error}=await sb.auth.signUp({email:f.get('email'),password:f.get('password'),options:{data:{name:f.get('name'),roblox:f.get('roblox'),discord:f.get('discord')}}});if(error)return toast(error.message);toast('Cadastro enviado. Verifique seu e-mail se a confirmação estiver ativada.');candidate()}}
function instructorRegister(){app.innerHTML='<div class="card" style="max-width:560px;margin:auto"><h1>📝 REGISTRAR-SE COMO INSTRUTOR</h1><p class="muted">O cadastro cria uma solicitação. O acesso de instrutor só será liberado após aprovação.</p><form id="ireg" class="form"><input name="name" placeholder="Nome" required><input name="roblox" placeholder="Roblox" required><input name="discord" placeholder="Discord" required><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha" required><input name="confirm" type="password" placeholder="Confirmar senha" required><button class="primary">ENVIAR SOLICITAÇÃO</button></form></div>';document.getElementById('ireg').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);if(f.get('password')!==f.get('confirm'))return toast('As senhas não coincidem.');const {error}=await sb.auth.signUp({email:f.get('email'),password:f.get('password'),options:{data:{name:f.get('name'),roblox:f.get('roblox'),discord:f.get('discord'),registration_type:'instructor'}}});if(error)return toast(error.message);toast('Solicitação enviada. Aguarde a análise da liderança.');go('admin')}}function forgot(){app.innerHTML='<div class="card" style="max-width:520px;margin:auto"><h1>🔑 ESQUECI MINHA SENHA</h1><p class="muted">Digite o e-mail da conta. Você receberá um link para abrir a tela de nova senha.</p><form id="fp" class="form"><input name="email" type="email" placeholder="E-mail" required><button class="primary">ENVIAR LINK</button></form></div>';document.getElementById('fp').onsubmit=async e=>{e.preventDefault();const email=new FormData(e.currentTarget).get('email');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'?reset=1'});if(error)return toast(error.message);toast('Se o e-mail estiver cadastrado, o link de recuperação foi enviado.');}}
async function resetPage(){app.innerHTML='<div class="card" style="max-width:520px;margin:auto"><h1>🔐 NOVA SENHA</h1><form id="rp" class="form"><input name="p" type="password" placeholder="Nova senha" required><input name="c" type="password" placeholder="Confirmar nova senha" required><button class="primary">ALTERAR SENHA</button></form></div>';document.getElementById('rp').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);if(f.get('p')!==f.get('c'))return toast('As senhas não coincidem.');const {error}=await sb.auth.updateUser({password:f.get('p')});if(error)return toast(error.message);toast('Senha alterada com sucesso.');history.replaceState({},'',location.pathname);await loadMe();go('home')}}
async function admin(){await loadMe();if(me&&profile&&admin())return adminPanel();app.innerHTML='<div class="back"><button class="ghost" onclick="go(\'home\')">← VOLTAR</button></div>'+authCard('👑 ADMINISTRAÇÃO');document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)return toast(error.message);await loadMe();if(!admin())return toast('Esta conta não possui acesso à Administração.');adminPanel()};document.getElementById('forgot').onclick=()=>forgot('admin');const rb=document.getElementById('register');if(me&&profile?.account_type==='instructor')rb.classList.add('hidden');rb.onclick=()=>instructorRegister()}
function adminPanel(){const nav=[['dashboard','📊 PAINEL',true],['proofs','📝 PROVAS',can('manage_proofs')],['templates','💾 MODELOS',can('manage_templates')],['requests','🛡️ SOLICITAÇÕES',can('manage_instructor_requests')],['punishments','⚠️ PUNIÇÕES',can('apply_punishment')],['permissions','⚙️ CARGOS/PERMISSÕES',can('manage_roles_permissions')],['identity','🖼️ IDENTIDADE',can('manage_identity')],['logs','📜 LOGS',can('view_audit_logs')]];app.innerHTML='<div class="sectionTitle"><h1>👑 '+esc(profile?.account_type==='admin'?'ADMINISTRAÇÃO':'ÁREA DO INSTRUTOR')+'</h1><button class="ghost" id="logout">SAIR</button></div><div class="adminbar">'+nav.filter(x=>x[2]).map(x=>'<button class="ghost gold" data-admin="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><div id="adminContent"></div>';document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();go('home')};document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>adminSection(b.dataset.admin));adminSection('dashboard')}
async function adminSection(x){const c=document.getElementById('adminContent');if(x==='dashboard'){const [{count:proofs},{count:req},{count:attempts}]=await Promise.all([sb.from('rz7_proofs').select('*',{count:'exact',head:true}),sb.from('rz7_instructor_applications').select('*',{count:'exact',head:true}).eq('status','pending'),sb.from('rz7_proof_attempts').select('*',{count:'exact',head:true}).eq('status','in_progress')]);c.innerHTML='<div class="grid"><div class="card"><h3>📝 PROVAS</h3><b>'+proofs+'</b></div><div class="card"><h3>🛡️ SOLICITAÇÕES</h3><b>'+req+'</b></div><div class="card"><h3>👁️ EM ANDAMENTO</h3><b>'+attempts+'</b></div></div><div class="card" style="margin-top:14px"><h3>🔐 Nível de acesso</h3><p class="muted">A interface é filtrada por permissão e o banco aplica RLS. A conta máxima é exclusiva do Administrador Supremo.</p></div>';return}if(x==='proofs')return proofsAdmin(c);if(x==='templates')return templatesAdmin(c);if(x==='requests')return requestsAdmin(c);if(x==='punishments')return punishAdmin(c);if(x==='permissions')return permissionsAdmin(c);if(x==='identity')return identityAdmin(c);if(x==='logs')return logsAdmin(c)}
async function proofsAdmin(c){const {data}=await sb.from('rz7_proofs').select('*').order('created_at',{ascending:false});c.innerHTML='<div class="sectionTitle"><h2>📝 PROVAS</h2><button class="primary" id="newProof">CRIAR NOVA PROVA</button></div><div class="list">'+(data||[]).map(p=>'<div class="row"><div><b>'+esc(p.code)+' · '+esc(p.name)+'</b><div class="small muted">'+esc(p.status)+' · '+esc(p.visibility)+' · '+Math.round(p.time_limit_seconds/60)+' min</div></div><div class="actions"><button class="ghost" data-open="'+p.id+'">'+(p.status==='open'?'FECHAR':'ABRIR')+'</button><button class="ghost" data-edit="'+p.id+'">EDITAR</button></div></div>').join('')+'</div>';document.getElementById('newProof').onclick=()=>proofForm();c.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{const id=b.dataset.open;const {data:p}=await sb.from('rz7_proofs').select('status').eq('id',id).single();const st=p.status==='open'?'closed':'open';const upd={status:st};if(st==='open')upd.opened_at=new Date().toISOString();else upd.closed_at=new Date().toISOString();const {error}=await sb.from('rz7_proofs').update(upd).eq('id',id);if(error)toast(error.message);proofsAdmin(c)});c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>proofForm(b.dataset.edit))}
async function proofForm(id=null){
let p=null,questions=[];
if(id){const r=await sb.from('rz7_proofs').select('*').eq('id',id).single();p=r.data;const qr=await sb.from('rz7_proof_questions').select('id,position,question,points').eq('proof_id',id).order('position');const or=await sb.from('rz7_proof_options').select('id,question_id,position,label').in('question_id',(qr.data||[]).map(x=>x.id));const cr=await sb.from('rz7_proof_correct_answers').select('question_id,option_id').in('question_id',(qr.data||[]).map(x=>x.id));questions=(qr.data||[]).map(q=>({...q,rz7_proof_options:(or.data||[]).filter(o=>o.question_id===q.id).map(o=>({...o,is_correct:(cr.data||[]).some(x=>x.question_id===q.id&&x.option_id===o.id)}))}))}
const latest=(await sb.from('rz7_proofs').select('number').order('number',{ascending:false}).limit(1)).data?.[0]?.number||0;

toast('Prova salva.');adminSection('proofs')}}async function templatesAdmin(c){const {data}=await sb.from('rz7_proof_templates').select('*').order('created_at',{ascending:false});c.innerHTML='<div class="sectionTitle"><h2>💾 MODELOS</h2><button class="primary" id="nt">NOVO MODELO</button></div><div class="list">'+(data||[]).map(t=>'<div class="row"><div><b>'+esc(t.name)+'</b><div class="small muted">'+esc(t.description||'')+'</div></div><button class="ghost" data-use="'+t.id+'">USAR MODELO</button></div>').join('')+'</div>';document.getElementById('nt').onclick=()=>templateForm();c.querySelectorAll('[data-use]').forEach(b=>b.onclick=async()=>{const {data:t}=await sb.from('rz7_proof_templates').select('*').eq('id',b.dataset.use).single();const n=(await sb.from('rz7_proofs').select('number').order('number',{ascending:false}).limit(1)).data?.[0]?.number+1||1;const {data:p,error}=await sb.from('rz7_proofs').insert({number:n,code:'RZ7-'+String(n).padStart(3,'0'),name:t.name,description:t.description,time_limit_seconds:t.time_limit_seconds,participant_limit:t.participant_limit,visibility:t.visibility,created_by:me.id,template_id:t.id}).select().single();if(error)return toast(error.message);const {error:qerr}=await sb.rpc('rz7_replace_proof_questions',{p_proof:p.id,p_questions:t.questions||[]});if(qerr)return toast(qerr.message);toast('Nova prova criada a partir do modelo.');adminSection('proofs')})}
function templateForm(){document.getElementById('adminContent').innerHTML='<div class="card"><h2>💾 NOVO MODELO</h2><form id="tf" class="form"><input name="name" placeholder="Nome do modelo" required><textarea name="description" placeholder="Descrição"></textarea><input name="time" type="number" min="1" value="30" placeholder="Tempo em minutos"><input name="limit" type="number" min="1" placeholder="Limite de participantes"><select name="visibility"><option value="public">Pública</option><option value="private">Privada</option></select><textarea name="questions" placeholder=\'JSON de perguntas. Ex.: [{"question":"Pergunta?","options":[{"label":"A","is_correct":true},{"label":"B","is_correct":false}]}]\'></textarea><button class="primary">SALVAR MODELO</button></form></div>';document.getElementById('tf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);let q=[];try{q=f.get('questions')?JSON.parse(f.get('questions')):[]}catch{return toast('JSON inválido.')}const {error}=await sb.from('rz7_proof_templates').insert({name:f.get('name'),description:f.get('description'),time_limit_seconds:Number(f.get('time'))*60,participant_limit:f.get('limit')?Number(f.get('limit')):null,visibility:f.get('visibility'),questions:q,created_by:me.id});if(error)return toast(error.message);adminSection('templates')}}
async function requestsAdmin(c){const {data}=await sb.from('rz7_instructor_applications').select('*').order('created_at',{ascending:false});c.innerHTML='<h2>🛡️ SOLICITAÇÕES DE INSTRUTOR</h2><div class="list">'+(data||[]).map(a=>'<div class="card"><b>'+esc(a.name)+'</b><div class="muted">'+esc(a.roblox)+' · '+esc(a.discord)+' · '+esc(a.email)+'</div><div class="pill">'+esc(a.status)+'</div>'+(a.status==='pending'?'<div class="actions" style="margin-top:10px"><button class="primary" data-ap="'+a.id+'">ACEITAR</button><button class="ghost danger" data-den="'+a.id+'">NEGAR</button><button class="ghost danger" data-pun="'+a.user_id+'">PUNIR</button></div>':'')+'</div>').join('')+'</div>';c.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>reviewApp(b.dataset.ap,true));c.querySelectorAll('[data-den]').forEach(b=>b.onclick=()=>reviewApp(b.dataset.den,false));c.querySelectorAll('[data-pun]').forEach(b=>b.onclick=()=>punishForm(b.dataset.pun))}
async function reviewApp(id,approve){const reason=prompt(approve?'Observação (opcional):':'Motivo da negativa:','');const {error}=await sb.rpc('rz7_review_instructor_application',{p_application:id,p_approve:approve,p_reason:reason});if(error)return toast(error.message);adminSection('requests')}
function punishForm(uid){document.getElementById('adminContent').innerHTML='<div class="card"><h2>⚠️ APLICAR PUNIÇÃO</h2><form id="pun" class="form"><input name="uid" value="'+esc(uid)+'" readonly><select name="type"><option value="warning">⚠️ Advertência</option><option value="instructor_request_block">🚫 Bloqueio de solicitação de instrutor</option><option value="proof_block">🔒 Bloqueio de provas</option><option value="suspension">⏱️ Suspensão</option><option value="permanent_proof_block">🔴 Bloqueio permanente de provas</option><option value="permanent_total_block">🔴 Bloqueio permanente total</option></select><textarea name="reason" placeholder="Motivo" required></textarea><input name="duration" type="number" min="1" max="2592000" value="86400" placeholder="Duração em segundos"><p class="small muted">Temporárias: duração em segundos, máximo 30 dias. Punições permanentes e o bloqueio total são exclusivos do Administrador Supremo.</p><button class="primary">APLICAR</button></form></div>';document.getElementById('pun').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),type=f.get('type'),permanent=type.startsWith('permanent_');const duration=permanent?null:Number(f.get('duration'));if(!permanent&&duration>2592000)return toast('Máximo de 30 dias.');if(permanent&&profile?.account_type!=='admin')return toast('Acesso negado.');if(type==='permanent_total_block'){if(profile?.account_type!=='admin')return toast('Somente o Administrador Supremo.');const {error}=await sb.functions.invoke('rz7-account-action',{body:{action:'permanent_total_block',user_id:f.get('uid')}});if(error)return toast(error.message);const {error:pe}=await sb.from('rz7_punishments').insert({user_id:f.get('uid'),type,reason:f.get('reason'),permanent:true,applied_by:me.id});if(pe)return toast(pe.message);toast('Bloqueio permanente total aplicado.');return adminSection('punishments')}const {error}=await sb.from('rz7_punishments').insert({user_id:f.get('uid'),type,reason:f.get('reason'),duration_seconds:duration,expires_at:permanent?null:new Date(Date.now()+duration*1000).toISOString(),permanent,applied_by:me.id});if(error)return toast(error.message);toast('Punição registrada.');adminSection('punishments')}}async function punishAdmin(c){const {data}=await sb.from('rz7_punishments').select('*').order('created_at',{ascending:false});c.innerHTML='<div class="sectionTitle"><h2>⚠️ PUNIÇÕES</h2></div><div class="list">'+(data||[]).map(p=>'<div class="row"><div><b>'+esc(p.type)+'</b><div class="small muted">Usuário: '+esc(p.user_id)+' · '+esc(p.reason)+'</div></div><span class="pill '+(p.permanent?'bad':'')+'">'+(p.permanent?'PERMANENTE':(p.expires_at?new Date(p.expires_at).toLocaleString('pt-BR'):'—'))+'</span></div>').join('')+'</div>'}
async function permissionsAdmin(c){const {data}=await sb.from('rz7_profiles').select('user_id,name,email,account_type,account_status,role_id').order('created_at');const {data:roles}=await sb.from('rz7_roles').select('*').order('level',{ascending:false});c.innerHTML='<h2>⚙️ CARGOS E PERMISSÕES</h2><div class="list">'+(data||[]).map(u=>'<div class="row"><div><b>'+esc(u.name||u.email)+'</b><div class="small muted">'+esc(u.account_type)+' · '+esc(u.account_status)+'</div></div><div class="actions"><select data-user="'+u.user_id+'">'+(roles||[]).map(r=>'<option value="'+r.id+'" '+(r.id===u.role_id?'selected':'')+'>'+esc(r.name)+'</option>').join('')+'</select><button class="ghost" data-perm="'+u.user_id+'">PERMISSÕES</button>'+(supreme&&u.user_id!==me.id?'<button class="ghost danger" data-delete="'+u.user_id+'">EXCLUIR</button>':'')+'</div></div>').join('')+'</div><p class="small muted">O Administrador Supremo é exclusivo. Permissões críticas e medidas permanentes ficam protegidas no banco.</p>';c.querySelectorAll('[data-user]').forEach(s=>s.onchange=async()=>{const {error}=await sb.rpc('rz7_set_user_role',{p_user:s.dataset.user,p_role:s.value});if(error){toast(error.message);permissionsAdmin(c)}});c.querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>userPermissionEditor(b.dataset.perm));c.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir esta conta permanentemente?'))return;const {error}=await sb.functions.invoke('rz7-account-action',{body:{action:'delete',user_id:b.dataset.delete}});if(error)return toast(error.message);toast('Conta excluída.');permissionsAdmin(c)})}
async function userPermissionEditor(uid){const {data:ps}=await sb.from('rz7_permissions').select('*').order('critical',{ascending:false});const {data:ups}=await sb.from('rz7_user_permissions').select('permission_id,allowed').eq('user_id',uid);const map=new Map((ups||[]).map(x=>[x.permission_id,x.allowed]));document.getElementById('adminContent').innerHTML='<div class="card"><div class="sectionTitle"><h2>⚙️ PERMISSÕES INDIVIDUAIS</h2><button class="ghost" id="backPerm">← VOLTAR</button></div><p class="muted">O cargo fornece permissões padrão. Aqui ficam os overrides individuais. Permissões críticas só podem ser alteradas pelo Administrador Supremo.</p><div class="list">'+(ps||[]).map(p=>'<label class="row"><span><b>'+esc(p.name)+'</b><div class="small muted">'+esc(p.description||'')+(p.critical?' · 🔴 CRÍTICA':'')+'</div></span><input type="checkbox" data-pid="'+p.id+'" '+(map.get(p.id)===true?'checked':'')+' '+(p.critical&&!supreme?'disabled':'')+'></label>').join('')+'</div></div>';document.getElementById('backPerm').onclick=()=>adminSection('permissions');document.querySelectorAll('[data-pid]').forEach(cb=>cb.onchange=async()=>{const pid=cb.dataset.pid;if(!supreme&&ps.find(p=>p.id===pid)?.critical){cb.checked=!cb.checked;return toast('Somente o Administrador Supremo pode alterar esta permissão.')}const {error}=await sb.from('rz7_user_permissions').upsert({user_id:uid,permission_id:pid,allowed:cb.checked,updated_at:new Date().toISOString()},{onConflict:'user_id,permission_id'});if(error)toast(error.message)})}async function identityAdmin(c){const s=await getSettings();const logo=s.logo_url?.replace(/^"|"$/g,'')||'';c.innerHTML='<div class="card"><h2>🖼️ IDENTIDADE RZ7</h2><form id="idform" class="form"><input name="logo" value="'+esc(logo)+'" placeholder="URL da logo"><input name="hair" value="rgb(46, 26, 5)" placeholder="Cor do cabelo"><button class="primary">SALVAR IDENTIDADE</button></form><p class="small muted">A logo é carregada por URL nesta primeira versão; a configuração fica protegida pela permissão de identidade.</p></div>';document.getElementById('idform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);for(const [key,value] of [['logo_url',JSON.stringify(f.get('logo'))],['hair_color',JSON.stringify(f.get('hair'))]]){const {error}=await sb.from('rz7_system_settings').upsert({key,value:JSON.parse(value),updated_by:me.id,updated_at:new Date().toISOString()});if(error)return toast(error.message)}toast('Identidade salva.');home()}}
async function logsAdmin(c){const {data}=await sb.from('rz7_audit_logs').select('*').order('created_at',{ascending:false}).limit(100);c.innerHTML='<h2>📜 LOGS</h2><div class="list">'+(data||[]).map(x=>'<div class="row"><div><b>'+esc(x.action)+'</b><div class="small muted">'+esc(x.entity_type||'')+' · '+esc(x.entity_id||'')+'</div></div><span class="small muted">'+new Date(x.created_at).toLocaleString('pt-BR')+'</span></div>').join('')+'</div>'}
async function candidateDash(){await loadMe();if(!profile)return candidate();if(profile.account_status==='blocked_permanently'){app.innerHTML='<div class="card"><h1>🔴 CONTA BLOQUEADA</h1><p>Esta conta está bloqueada permanentemente e não pode acessar provas ou registrar novas atividades.</p></div>';return}const {data:proofs}=await sb.from('rz7_proofs').select('*').eq('status','open').order('number');const {data:attempts}=await sb.from('rz7_proof_attempts').select('*').eq('candidate_id',me.id);const done=new Set((attempts||[]).map(a=>a.proof_id));app.innerHTML='<div class="sectionTitle"><h1>👤 PAINEL DO CANDIDATO</h1><button class="ghost" id="out">SAIR</button></div><div class="card"><h3>Meu cadastro</h3><p>'+esc(profile.name)+'<br>'+esc(profile.roblox)+' · '+esc(profile.discord)+'</p></div><div class="card" style="margin-top:14px"><h2>📝 PROVAS DISPONÍVEIS</h2><div class="list">'+(proofs||[]).map(p=>'<div class="row"><div><b>'+esc(p.code)+' · '+esc(p.name)+'</b><div class="small muted">'+(p.visibility==='private'?'🔒 Privada':'🌐 Pública')+' · '+Math.round(p.time_limit_seconds/60)+' min</div></div><button class="primary" data-start="'+p.id+'" '+(done.has(p.id)?'disabled':'')+'>'+(done.has(p.id)?'JÁ REALIZADA':(p.visibility==='private'?'SOLICITAR/INICIAR':'INICIAR PROVA'))+'</button></div>').join('')+'</div></div><div class="card" style="margin-top:14px"><h2>📊 MEUS RESULTADOS</h2><div class="list">'+(attempts||[]).map(a=>'<div class="row"><div><b>'+esc(a.status)+'</b><div class="small muted">'+esc(a.result_note||'')+'</div></div><span>'+esc(a.score??'—')+'%</span></div>').join('')+'</div></div>';document.getElementById('out').onclick=async()=>{await sb.auth.signOut();go('home')};app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startOrRequest(b.dataset.start))}
async function startOrRequest(id){const {data:p}=await sb.from('rz7_proofs').select('*').eq('id',id).single();if(p.visibility==='private'){const {data:r}=await sb.from('rz7_proof_access_requests').select('*').eq('proof_id',id).eq('candidate_id',me.id).maybeSingle();if(!r){const {error}=await sb.from('rz7_proof_access_requests').insert({proof_id:id,candidate_id:me.id});if(error)return toast(error.message);return toast('Solicitação enviada. Aguarde autorização do instrutor.')}if(r.status!=='approved')return toast(r.status==='pending'?'Aguardando autorização.':'Solicitação negada.')}const {data,error}=await sb.rpc('rz7_start_proof',{p_proof:id});if(error)return toast(error.message);currentAttempt=data;takeProof(id,data)}
async function takeProof(pid,aid){const {data:q}=await sb.from('rz7_proof_questions').select('id,position,question,points').eq('proof_id',pid).order('position');const {data:o}=await sb.from('rz7_proof_options').select('id,question_id,position,label').in('question_id',(q||[]).map(x=>x.id));const questions=(q||[]).map(x=>({...x,rz7_proof_options:(o||[]).filter(y=>y.question_id===x.id)}));let idx=0,answers={};function render(){const qq=questions[idx];const remain=questions.length?Math.round((idx/questions.length)*100):0;app.innerHTML='<div class="sectionTitle"><h1>📝 PROVA</h1><span id="clock" class="pill"></span></div><div class="progress"><i style="width:'+remain+'%"></i></div><div class="card question"><div class="small muted">Questão '+(idx+1)+' de '+questions.length+'</div><h2>'+esc(qq.question)+'</h2><div>'+qq.rz7_proof_options.map(o=>'<button class="option '+(answers[qq.id]===o.id?'selected':'')+'" data-o="'+o.id+'">'+esc(o.label)+'</button>').join('')+'</div><div class="actions" style="margin-top:14px">'+(idx?'<button class="ghost" id="prev">← ANTERIOR</button>':'')+(idx<questions.length-1?'<button class="primary" id="next">PRÓXIMA →</button>':'<button class="primary" id="finish">FINALIZAR PROVA</button>')+'</div></div>';app.querySelectorAll('[data-o]').forEach(b=>b.onclick=async()=>{answers[qq.id]=b.dataset.o;const {error}=await sb.rpc('rz7_save_answer',{p_attempt:aid,p_question:qq.id,p_option:b.dataset.o});if(error)return toast(error.message);render()});if(document.getElementById('prev'))document.getElementById('prev').onclick=()=>{idx--;render()};if(document.getElementById('next'))document.getElementById('next').onclick=()=>{if(!answers[qq.id])return toast('Selecione uma alternativa.');idx++;render()};if(document.getElementById('finish'))document.getElementById('finish').onclick=finish;updateClock()}function updateClock(){clearInterval(timer);const tick=async()=>{const {data:a}=await sb.from('rz7_proof_attempts').select('started_at,time_limit_seconds,status').eq('id',aid).single();if(!a)return;const left=Math.max(0,Math.floor((new Date(a.started_at).getTime()+a.time_limit_seconds*1000-Date.now())/1000));const clock=document.getElementById('clock');if(clock)clock.textContent='⏱️ '+Math.floor(left/60).toString().padStart(2,'0')+':'+(left%60).toString().padStart(2,'0');if(left<=0){clearInterval(timer);await sb.rpc('rz7_finish_proof',{p_attempt:aid});return showResult(aid)}};tick();timer=setInterval(tick,1000)}async function finish(){if(!confirm('Tem certeza que deseja finalizar a prova?'))return;clearInterval(timer);const {error}=await sb.rpc('rz7_finish_proof',{p_attempt:aid});if(error)return toast(error.message);showResult(aid)}render()}async function showResult(aid){const {data:a}=await sb.from('rz7_proof_attempts').select('*,rz7_proofs(code,name)').eq('id',aid).single();const approved=a.status==='approved',timeout=a.status==='failed_timeout';let desc=approved?'Parabéns, [NOME]. Você foi APROVADO na prova de conhecimento da La Hermandad RZ7.<br><br>Mas isso é apenas o começo. A partir de agora, você deverá realizar o Teste Oficial dentro do RP, onde será avaliado em situação real.<br><br>Após sua aprovação no teste, seguirá o Batismo da Hermandad — o momento em que sua entrada será oficialmente reconhecida.<br><br>Prepare-se. A partir daqui, você deixa de apenas conhecer a Hermandad... e começa a fazer parte dela. 🐺':timeout?'[NOME], sua avaliação foi encerrada porque o tempo destinado à prova chegou ao fim. Sua tentativa foi registrada como REPROVADA POR TEMPO.<br><br>Prepare-se melhor para uma próxima oportunidade. A Hermandad reconhece quem persiste. 🐺':'[NOME], sua avaliação foi concluída. Infelizmente, você NÃO FOI APROVADO na prova de conhecimento da La Hermandad RZ7.<br><br>Neste momento, você não poderá avançar para o Teste Oficial dentro do RP.<br><br>Estude, observe e esteja preparado. Uma segunda oportunidade poderá ser concedida pela liderança.<br><br>A Hermandad reconhece quem persiste. 🐺';desc=desc.replaceAll('[NOME]',esc(profile?.name||'candidato'));app.innerHTML='<div class="result"><div class="resultbox"><pre>╔══════════════════════════════╗\n║       RESULTADO DA PROVA     ║\n╠══════════════════════════════╣\n║ Prova: '+a.rz7_proofs.code+'\n║                              ║\n║ Questões: '+a.total_questions+'\n║ Acertos: '+a.correct_count+'\n║ Erros: '+a.wrong_count+'\n║                              ║\n║ Nota: '+a.score+'%\n║                              ║\n║ '+(approved?'🟢 APROVADO': '🔴 REPROVADO')+'\n║                              ║\n║ Tempo utilizado: '+Math.floor((new Date(a.finished_at)-new Date(a.started_at))/60000)+':'+String(Math.floor(((new Date(a.finished_at)-new Date(a.started_at))/1000)%60)).padStart(2,'0')+'\n╚══════════════════════════════╝</pre></div><div class="card"><h2>'+(approved?'🎖️':'❌')+' PROVA CONCLUÍDA</h2><p>'+desc+'</p></div><button class="primary" onclick="candidateDash()">VOLTAR AO PAINEL</button></div>'}
window.go=async x=>{if(x==='home')return home();if(x==='info')return info();if(x==='admin')return admin();if(x==='candidate')return candidate()};
sb.auth.onAuthStateChange(async(e)=>{if(e==='PASSWORD_RECOVERY'||new URLSearchParams(location.search).get('reset')==='1')resetPage()});
(async()=>{await loadMe();if(new URLSearchParams(location.search).get('reset')==='1')resetPage();else home();})();

grid;gap:11px}.form input,.form textarea,.form select{width:100%;background:#090909;border:1px solid #303030;color:var(--text);border-radius:10px;padding:12px;outline:none}.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--gold2)}.form textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap}.hidden{display:none!important}.back{margin-bottom:14px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}.sectionTitle h1{margin:0;font-size:28px}.list{display:grid;gap:10px}.row{background:#0d0d0d;border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:#202020;border:1px solid #333;color:#ddd;font-size:12px}.ok{color:#72d18b}.bad{color:#ff7676}.goldtxt{color:#e4c56c}.menu{position:fixed;inset:0 auto 0 0;width:min(330px,88vw);background:#0a0a0af7;border-right:1px solid #332816;z-index:50;padding:80px 18px 20px;transform:translateX(-105%);transition:.2s}.menu.open{transform:none}.menu button{display:block;width:100%;text-align:left;background:#111;border:1px solid var(--line);color:var(--text);padding:14px;border-radius:11px;margin:8px 0}.overlay{position:fixed;inset:0;background:#0009;z-index:40}.notice{padding:12px;border:1px solid #3c321f;background:#17130a;border-radius:12px;color:#dec77f}.result{max-width:520px;margin:20px auto}.resultbox{border:1px solid #5d4820;border-radius:18px;padding:18px;background:#0b0b0b}.resultbox pre{font:inherit;white-space:pre-wrap}.question{margin:16px 0}.option{display:block;width:100%;text-align:left;background:#0b0b0b;border:1px solid #333;color:var(--text);padding:13px;border-radius:10px;margin:8px 0}.option.selected{border-color:var(--gold);background:#1b160a}.progress{height:8px;background:#202020;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--gold);width:0}.adminbar{display:flex;gap:8px;overflow:auto;margin-bottom:15px;padding-bottom:3px}.adminbar button{white-space:nowrap}.danger{border-color:#693333;color:#ff8b8b}.small{font-size:12px}.footer{text-align:center;color:#777;margin-top:40px;font-size:12px}.manualHeader{text-align:center;margin:10px auto 22px;max-width:820px;padding:24px 10px;border-bottom:1px solid #332816}.manualHeader h1{margin:6px 0;font-size:clamp(28px,7vw,44px);letter-spacing:1px}.manualHeader p,.manualKicker{color:#d7c27d;letter-spacing:3px;font-size:12px}.manualKicker{font-weight:800}.manualIntro{max-width:820px;margin:0 auto 14px;border-color:#5a4520}.manualIntro h2{margin-top:0}.quote{color:#e4c56c;font-style:italic}.manualSections{max-width:820px;margin:auto}.manualButtons{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 auto 16px}.manualBtn{width:100%;text-align:left;padding:17px 16px;background:linear-gradient(180deg,#151515,#0d0d0d);border:1px solid #332816;border-radius:14px;color:var(--text);font-weight:800;transition:.16s transform,.16s border-color,.16s box-shadow}.manualBtn:hover,.manualBtn:focus{transform:translateY(-2px);border-color:#8d6a21;box-shadow:0 8px 24px #0007;outline:none}.manualBtn.active{border-color:var(--gold);box-shadow:0 0 0 1px #d7ad4233,0 8px 24px #0007}.manualBtn small{display:block;margin-top:5px;color:#8f8b83;font-weight:500}.manualView{margin-top:14px}.manualSection{position:relative;max-width:820px;margin:0 auto}.manualSection h2{margin:0 0 14px;font-size:22px}.manualBody{line-height:1.75;color:#ddd9cf}.manualBody p{margin:8px 0}.manualNum{color:#d7ad42;font-weight:900;font-size:13px;margin-bottom:8px}.equiv{display:grid;gap:8px}.equiv div{display:flex;justify-content:space-between;gap:15px;padding:11px 12px;background:#0a0a0a;border:1px solid #292929;border-radius:10px}.equiv b{color:#d7ad42}.equiv span{text-align:right}.progression{display:flex;flex-wrap:wrap;align-items:center;gap:7px;line-height:1.8}.progression span{padding:6px 9px;border:1px solid #3a301d;background:#0a0a0a;border-radius:8px;color:#e8dfc6}.progression i{color:#d7ad42;font-style:normal}.manualFooter{text-align:center;color:#716d64;font-size:11px;letter-spacing:2px;padding:28px 5px 10px}

/* ===== PAINEL DO CANDIDATO RZ7 — V1 ===== */
.candidateDash{max-width:900px;margin:0 auto;padding-bottom:30px}
.candidateTop{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.candidateBrand{display:flex;align-items:center;gap:12px}
.candidateMark{width:46px;height:46px;border:1px solid #604a20;border-radius:14px;display:grid;place-items:center;color:var(--gold);font-weight:950;font-size:15px;background:radial-gradient(circle at 50% 35%,#241b09,#0d0d0d 72%);box-shadow:0 0 24px #d7ad4215}
.candidateKicker{font-size:11px;letter-spacing:2.5px;color:#a99560;font-weight:800}
.candidateTitle{margin:2px 0 0;font-size:clamp(24px,6vw,34px);letter-spacing:.5px}
.candidateWelcome{position:relative;overflow:hidden;margin-bottom:14px;padding:22px;border-color:#4b3a1d;background:radial-gradient(circle at 92% 15%,#30230d55,transparent 35%),linear-gradient(135deg,#171510,#0c0c0c 72%);box-shadow:0 16px 45px #0008}
.candidateWelcome:after{content:"RZ7";position:absolute;right:-8px;bottom:-34px;font-size:125px;font-weight:1000;letter-spacing:-7px;color:#d7ad4208;pointer-events:none}
.candidateWelcome>*{position:relative;z-index:1}
.candidateWelcome h2{margin:0 0 5px;font-size:25px}
.candidateWelcome p{margin:0;color:#aaa59a;line-height:1.55}
.candidateStatus{display:inline-flex;align-items:center;gap:7px;margin-top:13px;padding:6px 10px;border-radius:999px;background:#10180f;border:1px solid #29462d;color:#79d18c;font-size:12px;font-weight:800;letter-spacing:.4px}
.candidateGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:14px;align-items:start}
.candidateCard{background:linear-gradient(180deg,#151515,#0c0c0c);border:1px solid #292929;border-radius:17px;padding:18px;box-shadow:0 12px 35px #0006}
.candidateCard.featured{border-color:#51401f;background:radial-gradient(circle at 100% 0,#2a200d35,transparent 40%),linear-gradient(180deg,#171612,#0c0c0c)}
.candidateCard h2{margin:0 0 14px;font-size:18px;letter-spacing:.2px}
.candidateProfile{display:grid;gap:9px}
.candidateField{display:flex;justify-content:space-between;gap:12px;padding:10px 11px;background:#0a0a0a;border:1px solid #222;border-radius:11px}
.candidateField span:first-child{color:#817e76;font-size:12px}
.candidateField span:last-child{font-weight:700;text-align:right;overflow-wrap:anywhere}
.candidateProofEmpty{text-align:center;padding:20px 10px;border:1px dashed #39342a;border-radius:13px;background:#0b0b0b}
.candidateProofEmpty .emptyIcon{font-size:30px;margin-bottom:7px}
.candidateProofEmpty strong{display:block;font-size:15px;margin-bottom:5px}
.candidateProofEmpty p{margin:0;color:#8f8b83;line-height:1.5;font-size:13px}
.candidateProofList{display:grid;gap:10px}
.candidateProof{padding:15px;border:1px solid #302c25;border-radius:13px;background:#0a0a0a}
.candidateProofHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.candidateProofCode{color:#d9bd6b;font-size:11px;letter-spacing:1.5px;font-weight:900}
.candidateProofName{font-size:16px;font-weight:850;margin-top:2px}
.candidateProofMeta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.candidateMeta{padding:5px 8px;border-radius:999px;background:#161616;border:1px solid #2d2d2d;color:#aaa59a;font-size:11px}
.candidateProofAction{width:100%}
.candidateResults{margin-top:14px}
.candidateResult{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid #292929;border-radius:12px;background:#0a0a0a}
.candidateResultScore{font-size:18px;font-weight:900;color:#e2c46c}
.candidateResultStatus{font-size:11px;font-weight:900;letter-spacing:.8px}
.candidateResultStatus.ok{color:#72d18b}.candidateResultStatus.bad{color:#ff7676}
@media(max-width:720px){
  .candidateDash{padding-bottom:10px}
  .candidateGrid{grid-template-columns:1fr}
  .candidateTop{align-items:flex-start}
  .candidateTitle{font-size:24px}
  .candidateMark{width:42px;height:42px}
  .candidateWelcome{padding:19px}
  .candidateWelcome h2{font-size:22px}
}
</style>

<body>
<header class="top"><button class="iconbtn" id="menuBtn">☰ MENU</button><button class="infoBtn" id="infoBtn">ℹ️ INFORMAÇÕES RZ7</button></header>
<div id="menu" class="menu"><button data-go="home">🏠 INÍCIO</button><button data-go="admin">👑 ADMINISTRAÇÃO</button></div><div id="overlay" class="overlay hidden"></div>
<main class="wrap" id="app"><section class="hero"><div class="logoFallback">RZ7</div><div class="diamond">──── ◈ ────</div><h1 class="title">PROVA DE CONHECIMENTO</h1><div class="sub">LA HERMANDAD RZ7</div><div class="tag">Sistema oficial de avaliação da Hermandad</div><button class="primary" id="candidateBtn">👤 CANDIDATO · COMEÇAR</button><div class="footer">── LA HERMANDAD RZ7 ──<br>© RZ7</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const createClient=window.supabase?.createClient;
if(!createClient) console.error("RZ7: biblioteca Supabase não carregou.");
const SUPABASE_URL='https://euazdymywhtgunjmztuv.supabase.co';
const SUPABASE_KEY='sb_publishable_XifsKYxSfBB-MITOf9s1Bw_W-5gfXaT';
const sbCandidate=createClient?createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'rz7_candidate_auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const sbAdmin=createClient?createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'rz7_admin_auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
let sb=sbCandidate;
let instructorPaused=false,instructorAccessBlocked=false;
const app=document.getElementById('app'),menu=document.getElementById('menu'),overlay=document.getElementById('overlay');
let me=null, profile=null, perms=new Set(), currentAttempt=null, timer=null, supreme=false;
function useAuth(kind){sb=kind==='admin'?sbAdmin:sbCandidate;me=null;profile=null;perms=new Set();supreme=false;}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const toast=m=>alert(m);
function closeMenu(){menu.classList.remove('open');overlay.classList.add('hidden')}
document.getElementById('menuBtn').onclick=()=>{menu.classList.add('open');overlay.classList.remove('hidden')};overlay.onclick=closeMenu;
document.querySelectorAll('#menu [data-go]').forEach(b=>b.onclick=()=>{closeMenu();go(b.dataset.go)});
document.getElementById('infoBtn').onclick=()=>go('info');
function logoHtml(url){return url?'<img class="logo" src="'+esc(url)+'" alt="RZ7">':'<div class="logoFallback">RZ7</div>'}
async function loadMe(){if(!sb?.auth){me=null;profile=null;perms=new Set();supreme=false;instructorPaused=false;instructorAccessBlocked=false;return}const {data:{user}}=await sb.auth.getUser();me=user||null;instructorPaused=false;instructorAccessBlocked=false;if(!me){profile=null;perms=new Set();return}const {data:p,error:pe}=await sb.rpc('rz7_get_my_profile');profile=p||null;supreme=false;if(pe){console.error('Erro ao carregar perfil:',pe);return}if(profile){const {data:rr}=await sb.from('rz7_roles').select('is_supreme').eq('id',profile.role_id).maybeSingle();supreme=!!rr?.is_supreme;const {data:rps}=await sb.from('rz7_role_permissions').select('permission_id,rz7_permissions(key)').eq('role_id',profile.role_id);perms=new Set();(rps||[]).forEach(x=>{if(x.rz7_permissions?.key)perms.add(x.rz7_permissions.key)});const {data:ups}=await sb.from('rz7_user_permissions').select('allowed,rz7_permissions(key)').eq('user_id',me.id);(ups||[]).forEach(x=>{if(x.rz7_permissions?.key){if(x.allowed)perms.add(x.rz7_permissions.key);else perms.delete(x.rz7_permissions.key)}});if(profile.account_type==='instructor'&&!supreme){const {data:ps}=await sb.from('rz7_punishments').select('type,permanent,expires_at').eq('user_id',me.id).is('revoked_at',null);const now=Date.now();(ps||[]).forEach(x=>{const active=x.permanent||!x.expires_at||new Date(x.expires_at).getTime()>now;if(active&&x.type==='instructor_pause')instructorPaused=true;if(active&&x.type==='instructor_access_block')instructorAccessBlocked=true})}}}
function can(p){return profile?.account_status==='active'&&(supreme || perms.has(p))}
function hasAdminAccess(){return !!profile&&profile.account_status==='active'&&!!profile.instructor_enabled&&(!instructorAccessBlocked&&!instructorPaused)}
async function getSettings(){const {data}=await sb.from('rz7_system_settings').select('*');return Object.fromEntries((data||[]).map(x=>[x.key,x.value]))}
async function home(){document.querySelector('#menu [data-go="admin"]').style.display='block';app.innerHTML='<section class="hero"><div id="homeLogo">'+logoHtml('')+'</div><div class="diamond">──── ◈ ────</div><h1 class="title">PROVA DE CONHECIMENTO</h1><div class="sub">LA HERMANDAD RZ7</div><div class="tag">Sistema oficial de avaliação da Hermandad</div><button class="primary" id="candidateBtn">👤 CANDIDATO · COMEÇAR</button><div class="footer">── LA HERMANDAD RZ7 ──<br>© RZ7</div></section>';const btn=document.getElementById('candidateBtn');if(btn)btn.onclick=()=>candidate();try{const s=await getSettings();const logo=s.logo_url?.replace(/^"|"$/g,'')||'';const holder=document.getElementById('homeLogo');if(holder&&logo)holder.innerHTML=logoHtml(logo)}catch(e){console.error(e)}}
async function info(){
const {data}=await sb.from('rz7_information_sections').select('*').eq('enabled',true).order('position');
const sections=(data||[]);
const manual=[
{key:'conduct',title:'⚖️ 1. RESPEITO E CONDUTA',body:`<p>• Respeite todos os membros da RZ7, independentemente do cargo.</p><p>• Respeite a hierarquia e as decisões dos superiores.</p><p>• Não provoque, ofenda ou crie conflitos desnecessários dentro do servidor.</p><p>• Discussões pessoais não devem interferir no funcionamento da RZ7.</p><p>• Mantenha uma postura adequada ao ambiente de RP.</p>`},
{key:'hierarchy',title:'👑 2. HIERARQUIA',body:`<p>• Respeite a cadeia de comando.</p><p>• Ordens de superiores devem ser cumpridas quando forem compatíveis com as regras do servidor/RP.</p><p>• Não utilize seu cargo para intimidar ou prejudicar outros membros.</p><p>• Não peça promoções insistentemente.</p><p>• Promoções são baseadas em desempenho, confiança e avaliação da liderança.</p>`},
{key:'missions',title:'🎯 3. MISSÕES',body:`<p>• Toda missão deve ser executada conforme as instruções recebidas.</p><p>• Leia atentamente o objetivo antes de iniciar uma missão.</p><p>• Erros, descumprimento de ordens ou abandono podem afetar sua avaliação.</p><p>• Não invente informações sobre uma missão concluída.</p><p>• Ao finalizar, informe corretamente o resultado ao responsável.</p>`},
{key:'operations',title:'🔥 4. OPERAÇÕES',body:`<p>• Mantenha comunicação adequada durante operações.</p><p>• Não atrapalhe uma operação deliberadamente.</p><p>• Não divulgue informações internas para pessoas que não possuem autorização.</p><p>• Siga as instruções do responsável pela operação.</p><p>• Evite ações que prejudiquem o RP ou a experiência dos demais jogadores.</p>`},
{key:'internal',title:'🔐 5. INFORMAÇÕES INTERNAS',body:`<p>• Informações internas da RZ7 devem permanecer dentro dos canais apropriados.</p><p>• Não compartilhe prints, mensagens, planos ou decisões internas sem autorização.</p><p>• Não forneça informações estratégicas a pessoas externas à organização.</p>`},
{key:'identity',title:'🎨 6. IDENTIDADE',body:`<p>• Mantenha o padrão visual estabelecido pela RZ7.</p><p>• <b>Cor de cabelo obrigatória: RGB 46, 26, 5.</b></p><p>• O corte ou penteado fica a critério do membro, desde que a cor seja respeitada.</p>`},
{key:'discord',title:'💬 7. DISCORD',body:`<p>• Utilize cada canal para sua finalidade.</p><p>• Não faça spam ou flood.</p><p>• Não abuse de bots, comandos ou outras funcionalidades.</p><p>• Não utilize @everyone ou @here sem autorização.</p><p>• Não envie conteúdo que viole as regras do Discord ou do servidor.</p>`},
{key:'authority',title:'🛡️ 8. AUTORIDADE',body:`<p>• Cargos superiores possuem responsabilidades maiores, não privilégios absolutos.</p><p>• Abuso de autoridade será avaliado pela liderança.</p><p>• Nenhum membro está acima das regras internas.</p><p>• Caso discorde de uma decisão, procure um superior de forma respeitosa.</p>`},
{key:'promotions',title:'📈 9. PROMOÇÕES',body:`<p>A progressão ocorre através de:</p><p>✅ Desempenho</p><p>✅ Disciplina</p><p>✅ Confiança</p><p>✅ Lealdade</p><p>✅ Missões concluídas</p><p>✅ Capacidade de assumir novas responsabilidades</p><p><b>Não existe promoção automática por tempo de permanência.</b></p>`},
{key:'penalties',title:'⚠️ 10. PENALIDADES',body:`<p>O sistema disciplinar considera a gravidade, as provas e a reincidência.</p><p>🟡 <b>1ª advertência:</b> registro formal da infração.</p><p>🟡 <b>2ª advertência:</b> novo registro disciplinar e alerta sobre reincidência.</p><p>🟡 <b>3ª advertência:</b> ao atingir o limite de 3 advertências, ocorre <b>perda de privilégios</b>.</p><p>🟠 <b>Após perda de privilégios:</b> novas infrações podem resultar em <b>rebaixamento</b>.</p><p>⛔ Conforme a gravidade ou reincidência, a situação também poderá resultar em <b>suspensão</b>.</p><p>🚫 Em casos graves ou reincidência extrema, poderá ocorrer <b>expulsão da RZ7</b>.</p><p>A liderança avaliará cada situação individualmente.</p>`},
{key:'command',title:'👑 COMANDO DA RZ7',body:`<p>As regras existem para manter organização, respeito, disciplina e qualidade de RP.</p><p><b>Entre para conquistar confiança.<br>Permaneça para provar seu valor.<br>Suba porque merece.</b></p><p class="quote">“Não buscamos respeito. Nós o conquistamos.”</p>`},
{key:'structure',title:'🎮 HIERARQUIA E EQUIVALÊNCIA NO GAME',body:`<div class="equiv"><div><b>BOSS</b><span>EL PATRÓN</span></div><div><b>UNDERBOSS</b><span>EL PADRINO</span></div><div><b>LIEUTENANT</b><span>IL CONSIGLIERE / EL CAPO / EL LUGARTENIENTE</span></div><div><b>SOLDIER</b><span>EL SOLDATO / EL SICARIO</span></div><div><b>ASSOCIATE</b><span>EL ASOCIADO</span></div><div><b>RECRUIT</b><span>EL RECLUTA / EL ASPIRANTE</span></div></div><p class="muted">Os níveis oficiais do game são: BOSS → UNDERBOSS → LIEUTENANT → SOLDIER → ASSOCIATE → RECRUIT.</p><h3 style="margin-top:22px">📈 PROGRESSÃO RZ7</h3><div class="progression"><span>EL RECLUTA</span><i>→</i><span>EL ASPIRANTE</span><i>→</i><span>EL ASOCIADO</span><i>→</i><span>EL SOLDATO</span><i>→</i><span>EL SICARIO</span><i>→</i><span>EL LUGARTENIENTE</span><i>→</i><span>EL CAPO</span><i>→</i><span>IL CONSIGLIERE</span><i>→</i><span>EL PADRINO</span><i>→</i><span>EL PATRÓN</span></div><p class="muted">A hierarquia interna possui denominações mais específicas, enquanto o game trabalha com os seis níveis oficiais.</p>`}

async function templatesAdmin(c){

  if(error)return toast(error.message);

      '<button class="ghost" data-use="'+t.id+'">USAR MODELO</button>'+
      (canDeleteTemplates?'<button class="ghost danger" data-delete-template="'+t.id+'">🗑️ EXCLUIR</button>':'')+
      '</div></div>').join('')+'</div>';

    let identity={number:null,code:null};
    if(supreme){
      const latest=(await sb.from('rz7_proofs').select('number').order('number',{ascending:false}).limit(1)).data?.[0]?.number||0;
      const n=latest+1;
      identity={number:n,code:'RZ7-'+String(n).padStart(3,'0')};
    }
    const payload={name:t.name,description:t.description,time_limit_seconds:t.time_limit_seconds,participant_limit:t.participant_limit,visibility:t.visibility,created_by:me.id,template_id:t.id};

    const {data:p,error}=await sb.from('rz7_proofs').insert(payload).select().single();
    if(error)return toast(error.message);
    const {error:qerr}=await sb.rpc('rz7_replace_proof_questions',{p_proof:p.id,p_questions:modelQuestions});
    if(qerr)return toast(qerr.message);
    toast('Modelo carregado. Revise e configure sua nova prova antes de abrir.');
    proofForm(p.id)
  });
  c.querySelectorAll('[data-delete-template]').forEach(b=>b.onclick=async()=>{
    if(!canDeleteTemplates)return toast('Você não possui permissão para excluir modelos.');
    const id=b.dataset.deleteTemplate;
    const {data:t,error:te}=await sb.from('rz7_proof_templates').select('id,name').eq('id',id).single();
    if(te)return toast(te.message);
    if(!confirm('⚠️ EXCLUIR MODELO\\n\\nExcluir permanentemente o modelo "'+t.name+'"?\\n\\nIsso remove apenas o modelo salvo. Provas já criadas a partir dele não serão apagadas.\\n\\nDeseja continuar?'))return;
    const {error}=await sb.from('rz7_proof_templates').delete().eq('id',id);
    if(error)return toast('Não foi possível excluir o modelo: '+error.message);
    toast('Modelo excluído permanentemente.');
    templatesAdmin(c);

 render();document.getElementById('addTemplateQuestion').onclick=()=>{sync();templateQuestions.push({question:'',question_type:'single',points:1,options:[{label:'',is_correct:true},{label:'',is_correct:false}]});render()};qb.onchange=e=>{if(e.target.matches('[data-field="type"]')){sync();render()}};qb.onclick=e=>{const rm=e.target.closest('[data-remove-tq]');if(rm){sync();templateQuestions.splice(Number(rm.dataset.removeTq),1);if(!templateQuestions.length)templateQuestions.push({question:'',question_type:'single',points:1,options:[{label:'',is_correct:true},{label:'',is_correct:false}]});render();return}const ro=e.target.closest('[data-remove-to]');if(ro){sync();const [qi,oi]=ro.dataset.removeTo.split(',').map(Number);if(templateQuestions[qi].options.length<=2)return toast('Cada questão precisa ter pelo menos 2 alternativas.');templateQuestions[qi].options.splice(oi,1);if(!templateQuestions[qi].options.some(o=>o.is_correct))templateQuestions[qi].options[0].is_correct=true;render();return}const add=e.target.closest('[data-add-to]');if(add){sync();const qi=Number(add.dataset.addTo);if(templateQuestions[qi].options.length>=6)return toast('Máximo de 6 alternativas por questão.');templateQuestions[qi].options.push({label:'',is_correct:false});render()}};document.getElementById('tf').onsubmit=async e=>{e.preventDefault();sync();if(!templateQuestions.length)return toast('Adicione pelo menos uma questão.');for(let i=0;i<templateQuestions.length;i++){const q=templateQuestions[i];if(!q.question.trim())return toast('Preencha a questão '+(i+1)+'.');if(q.question_type!=='text'){if(q.options.length<2)return toast('A questão '+(i+1)+' precisa de pelo menos 2 alternativas.');const n=q.options.filter(o=>o.is_correct).length;if(!n)return toast('Marque pelo menos uma correta na questão '+(i+1)+'.');if(q.question_type==='single'&&n!==1)return toast('Resposta única exige exatamente 1 correta na questão '+(i+1)+'.');if(q.options.some(o=>!o.label.trim()))return toast('Preencha todas as alternativas da questão '+(i+1)+'.')}}const f=new FormData(e.currentTarget);const {error}=await sb.from('rz7_proof_templates').insert({name:f.get('name'),description:f.get('description'),time_limit_seconds:Number(f.get('time'))*60,participant_limit:f.get('limit')?Number(f.get('limit')):null,visibility:f.get('visibility'),questions:templateQuestions,created_by:me.id});if(error)return toast(error.message);toast('Modelo salvo.');adminSection('templates')};

async function reviewApp(id,approve){
  if(approve){
    const reason=prompt('Observação para a autorização (opcional):','');
    if(reason===null)return;
    const {error}=await sb.rpc('rz7_review_instructor_application',{
      p_application:id,
      p_approve:true,
      p_reason:reason
    });
    if(error)return toast(error.message);
    toast('Instrutor aprovado.');
    return adminSection('requests');
  }

  const reason=prompt('Motivo da negativa (obrigatório):','');
  if(reason===null)return;
  if(!reason.trim())return toast('Informe o motivo da negativa.');

  const choice=prompt(
    'NEGATIVA — escolha o destino da conta:\n\n'+
    '0 = SEM PUNIÇÃO → exclui a solicitação e a conta. A pessoa poderá fazer um NOVO REGISTRO e receber NOVO E-MAIL DE CONFIRMAÇÃO.\n\n'+
    '1 = ADVERTÊNCIA\n'+
    '2 = BLOQUEAR NOVAS SOLICITAÇÕES\n'+
    '3 = BLOQUEAR PROVAS\n'+
    '4 = SUSPENSÃO\n'+
    '5 = BLOQUEIO PERMANENTE DE PROVAS\n'+
    '6 = BLOQUEIO PERMANENTE TOTAL\n\n'+
    'Digite 0, 1, 2, 3, 4, 5 ou 6:',
    '0'
  );
  if(choice===null)return;
  const map={
    '1':'warning',
    '2':'instructor_request_block',
    '3':'proof_block',
    '4':'suspension',
    '5':'permanent_proof_block',
    '6':'permanent_total_block'
  };
  if(!Object.prototype.hasOwnProperty.call(map,choice) && choice!=='0')
    return toast('Opção inválida.');

  if(choice==='0'){
    const ok=confirm(
      '⚠️ NEGAR SEM PUNIÇÃO\n\n'+
      'A conta e a solicitação serão excluídas.\n'+
      'O histórico dessa tentativa não ficará vinculado à conta.\n\n'+
      'Depois disso, a pessoa poderá se registrar novamente como uma nova conta e receber um novo e-mail de confirmação.\n\n'+
      'Continuar?'
    );
    if(!ok)return;
    const {error}=await sb.rpc('rz7_review_instructor_application',{
      p_application:id,
      p_approve:false,
      p_reason:reason,
      p_punishment_type:null,
      p_punishment_duration_seconds:null,
      p_punishment_permanent:false
    });
    if(error)return toast(error.message);
    toast('Negativa registrada. A conta foi descartada e poderá realizar um novo registro.');
    return adminSection('requests');
  }

  let permanent=false;
  let duration=86400;
  if(choice==='5'||choice==='6'){
    const p=confirm('Aplicar esta punição de forma PERMANENTE?\n\nOK = permanente\nCancelar = temporária');
    permanent=p;
  }
  if(!permanent){
    const d=prompt('Duração da punição em segundos (máximo 2.592.000 = 30 dias):',String(duration));
    if(d===null)return;
    duration=Number(d);
    if(!Number.isInteger(duration)||duration<1||duration>2592000)
      return toast('A duração deve estar entre 1 segundo e 2.592.000 segundos.');
  }else{
    duration=null;
  }

  const {error}=await sb.rpc('rz7_review_instructor_application',{
    p_application:id,
    p_approve:false,
    p_reason:reason,
    p_punishment_type:map[choice],
    p_punishment_duration_seconds:duration,
    p_punishment_permanent:permanent
  });
  if(error)return toast(error.message);
  toast('Solicitação negada e punição registrada. A conta e o histórico foram preservados.');
  adminSection('requests');
}

    (data||[]).map(u=>'<div class="row"><div><b>'+esc(u.name||u.email)+'</b><div class="small muted">'+(u.account_type==='instructor'?'🛡️ INSTRUTOR':'👑 ADMINISTRADOR')+' · '+esc(u.account_status)+'</div></div><div class="actions"><select data-user="'+u.user_id+'">'+(roles||[]).map(r=>'<option value="'+r.id+'" '+(r.id===u.role_id?'selected':'')+'>'+esc(r.name)+'</option>').join('')+'</select><button class="ghost" data-perm="'+u.user_id+'">PERMISSÕES</button>'+(u.account_type==='instructor'&&(supreme||can('manage_instructors'))?'<button class="ghost danger" data-remove-instructor="'+u.user_id+'">REMOVER CARGO</button>':'')+(supreme&&u.user_id!==me.id?'<button class="ghost danger" data-delete="'+u.user_id+'">EXCLUIR</button>':'')+'</div></div>').join('')+
    '</div><p class="small muted">Solicitações pendentes ou negadas não aparecem aqui e não recebem acesso à Administração.</p>';
  c.querySelectorAll('[data-user]').forEach(s=>s.onchange=async()=>{const {error}=await sb.rpc('rz7_set_user_role',{p_user:s.dataset.user,p_role:s.value});if(error){toast(error.message);permissionsAdmin(c)}});
  c.querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>userPermissionEditor(b.dataset.perm));
  c.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir esta conta permanentemente?'))return;const {error}=await sb.functions.invoke('rz7-account-action',{body:{action:'delete',user_id:b.dataset.delete}});if(error)return toast(error.message);toast('Conta excluída.');permissionsAdmin(c)})
  c.querySelectorAll('[data-remove-instructor]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Remover o cargo de instrutor desta conta? A conta continuará existindo como candidato, mas perderá o cargo e todas as permissões individuais de instrutor.'))return;
    const {error}=await sb.rpc('rz7_remove_instructor_role',{p_user:b.dataset.removeInstructor});

  })
}
async function userPermissionEditor(uid){const {data:ps}=await sb.from('rz7_permissions').select('*').order('critical',{ascending:false});const {data:ups}=await sb.from('rz7_user_permissions').select('permission_id,allowed').eq('user_id',uid);const map=new Map((ups||[]).map(x=>[x.permission_id,x.allowed]));document.getElementById('adminContent').innerHTML='<div class="card"><div class="sectionTitle"><h2>⚙️ PERMISSÕES INDIVIDUAIS</h2><button class="ghost" id="backPerm">← VOLTAR</button></div><p class="muted">O cargo fornece permissões padrão. Aqui ficam os overrides individuais. Permissões críticas só podem ser alteradas pelo Administrador Supremo.</p><div class="list">'+(ps||[]).map(p=>'<label class="row"><span><b>'+esc(p.name)+'</b><div class="small muted">'+esc(p.description||'')+(p.critical?' · 🔴 CRÍTICA':'')+'</div></span><input type="checkbox" data-pid="'+p.id+'" '+(map.get(p.id)===true?'checked':'')+' '+(p.critical&&!supreme?'disabled':'')+'></label>').join('')+'</div></div>';document.getElementById('backPerm').onclick=()=>adminSection('permissions');document.querySelectorAll('[data-pid]').forEach(cb=>cb.onchange=async()=>{const pid=cb.dataset.pid;if(!supreme&&ps.find(p=>p.id===pid)?.critical){cb.checked=!cb.checked;return toast('Somente o Administrador Supremo pode alterar esta permissão.')}const {error}=await sb.from('rz7_user_permissions').upsert({user_id:uid,permission_id:pid,allowed:cb.checked,updated_at:new Date().toISOString()},{onConflict:'user_id,permission_id'});if(error)toast(error.message)})}async function identityAdmin(c){
  const s=await getSettings();
  const logo=s.logo_url?.replace(/^"|"$/g,'')||'';
  c.innerHTML='<div class="card"><h2>🖼️ IDENTIDADE RZ7</h2>'+
    '<div style="display:grid;gap:14px">'+
      '<div><div class="small muted" style="margin-bottom:7px">LOGOTIPO ATUAL</div><div id="logoPreview" style="min-height:110px;border:1px solid #2d2d2d;border-radius:14px;background:#090909;display:grid;place-items:center;padding:14px">'+
        (logo?'<img src="'+esc(logo)+'" alt="Logo RZ7" style="max-width:220px;max-height:110px;object-fit:contain">':'<span class="muted">Nenhuma logo configurada</span>')+
      '</div></div>'+
      '<form id="idform" class="form">'+
        '<label>📤 ALTERAR LOGOTIPO<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></label>'+
        '<div class="small muted">PNG, JPG ou WEBP · máximo 5 MB</div>'+
        '<label>🔗 URL DA LOGO (opcional)<input name="logo" value="'+esc(logo)+'" placeholder="https://..."></label>'+
        '<label>🎨 COR OFICIAL DO CABELO<input name="hair" value="rgb(46, 26, 5)" placeholder="rgb(46, 26, 5)"></label>'+
        '<button class="primary" type="submit">SALVAR IDENTIDADE</button>'+
      '</form>'+
      '<p class="small muted">A imagem enviada fica armazenada no Supabase e somente o Administrador Supremo pode alterar ou excluir a logo.</p>'+
    '</div></div>';
  const file=document.getElementById('logoFile');
  const preview=document.getElementById('logoPreview');
  if(file)file.onchange=()=>{
    const f=file.files?.[0];
    if(!f)return;
    if(f.size>5*1024*1024){file.value='';return toast('A logo deve ter no máximo 5 MB.')}
    const reader=new FileReader();
    reader.onload=()=>{preview.innerHTML='<img src="'+reader.result+'" alt="Pré-visualização" style="max-width:220px;max-height:110px;object-fit:contain">';};
    reader.readAsDataURL(f);
  };
  document.getElementById('idform').onsubmit=async e=>{
    e.preventDefault();
    const form=e.currentTarget;
    const f=new FormData(form);
    const image=file?.files?.[0];
    let logoUrl=String(f.get('logo')||'').trim();
    if(image){
      if(image.size>5*1024*1024)return toast('A logo deve ter no máximo 5 MB.');
      const ext=(image.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'')||'png';
      const path='logo-rz7.'+ext;
      const {error:uploadError}=await sb.storage.from('rz7-identity').upload(path,image,{upsert:true,contentType:image.type||'image/png',cacheControl:'3600'});
      if(uploadError)return toast('Não foi possível enviar a logo: '+uploadError.message);
      const {data:pub}=sb.storage.from('rz7-identity').getPublicUrl(path);
      logoUrl=pub?.publicUrl||'';
    }
    if(!logoUrl)return toast('Escolha uma imagem ou informe uma URL para a logo.');
    for(const [key,value] of [['logo_url',logoUrl],['hair_color',String(f.get('hair')||'rgb(46, 26, 5)')]]){
      const {error}=await sb.from('rz7_system_settings').upsert({key,value,updated_by:me.id,updated_at:new Date().toISOString()});
      if(error)return toast(error.message);
    }
    toast('Identidade salva.');
    await home();
  };
}
async function logsAdmin(c){const {data}=await sb.from('rz7_audit_logs').select('*').order('created_at',{ascending:false}).limit(100);c.innerHTML='<h2>📜 LOGS</h2><div class="list">'+(data||[]).map(x=>'<div class="row"><div><b>'+esc(x.action)+'</b><div class="small muted">'+esc(x.entity_type||'')+' · '+esc(x.entity_id||'')+'</div></div><span class="small muted">'+new Date(x.created_at).toLocaleString('pt-BR')+'</span></div>').join('')+'</div>'}
async function candidateDash(){
  await loadMe();
  if(!profile)return candidate();
  if(!profile.candidate_enabled){await sbCandidate.auth.signOut();return toast('Esta conta não possui acesso de candidato.');}
  if(profile.account_status==='blocked_permanently'){
    app.innerHTML='<div class="candidateDash"><div class="candidateCard"><h1>🔴 CONTA BLOQUEADA</h1><p>Esta conta está bloqueada permanentemente e não pode acessar provas ou registrar novas atividades.</p></div></div>';
    return;
  }

  const {data:proofs,error:pe}=await sb.from('rz7_proofs').select('*').eq('status','open').order('number');
  if(pe)return toast(pe.message);
  const {data:attempts,error:ae}=await sb.from('rz7_proof_attempts').select('*').eq('candidate_id',me.id).order('started_at',{ascending:false});
  if(ae)return toast(ae.message);
  const {data:requests,error:re}=await sb.from('rz7_proof_access_requests').select('*').eq('candidate_id',me.id).order('created_at',{ascending:false});
  if(re)return toast(re.message);

  const done=new Set((attempts||[]).map(a=>a.proof_id));
  const reqMap=new Map((requests||[]).map(r=>[r.proof_id,r]));
  const firstName=esc((profile.name||'Candidato').split(' ')[0]);
  const profileFields=[
    ['NOME',profile.name||'—'],
    ['ROBLOX',profile.roblox||'—'],
    ['DISCORD',profile.discord||'—'],
    ['E-MAIL',me.email||'—']
  ];

  const proofHtml=(proofs||[]).map(p=>{
    const r=reqMap.get(p.id),doneProof=done.has(p.id);
    let action='';
    if(doneProof) action='<button class="ghost candidateProofAction" disabled>✓ PROVA JÁ REALIZADA</button>';
    else if(p.visibility==='private'){
      if(r?.status==='approved') action='<button class="primary candidateProofAction" data-start="'+p.id+'">COMEÇAR PROVA →</button>';
      else if(r?.status==='pending') action='<button class="ghost candidateProofAction" disabled>⏳ AGUARDANDO AUTORIZAÇÃO</button>';
      else if(r?.status==='denied') action='<button class="ghost danger candidateProofAction" disabled>🚫 SOLICITAÇÃO NEGADA</button>';
      else action='<button class="primary candidateProofAction" data-start="'+p.id+'">SOLICITAR ACESSO →</button>';
    }else action='<button class="primary candidateProofAction" data-start="'+p.id+'">COMEÇAR PROVA →</button>';

    const status=p.visibility==='private'
      ? (r?.status==='approved'?'🔓 Acesso autorizado':r?.status==='pending'?'🔒 Solicitação em análise':r?.status==='denied'?'🚫 Acesso negado':'🔒 Requer autorização')
      : '🌐 Acesso público';

    return '<article class="candidateProof">'+
      '<div class="candidateProofHead"><div><div class="candidateProofCode">'+esc(p.code)+'</div><div class="candidateProofName">'+esc(p.name)+'</div></div><span class="pill">'+status+'</span></div>'+
      '<div class="candidateProofMeta"><span class="candidateMeta">📝 '+esc(p.total_questions||10)+' questões</span><span class="candidateMeta">⏱️ '+Math.round((p.time_limit_seconds||600)/60)+' minutos</span><span class="candidateMeta">🎯 Mínimo 70%</span></div>'+
      action+
    '</article>';
  }).join('');

  const resultHtml=(attempts||[]).map(a=>{
    const approved=a.status==='approved',manual=a.status==='manual_review';
    return '<div class="candidateResult"><div><div class="candidateResultStatus '+(approved?'ok':'bad')+'">'+(approved?'✓ APROVADO':manual?'🟠 AGUARDANDO CORREÇÃO':'✕ '+(a.status==='failed_timeout'?'REPROVADO POR TEMPO':'REPROVADO') )+'</div><div class="small muted">'+esc(a.result_note||'Prova de conhecimento')+'</div></div><div class="candidateResultScore">'+esc(a.score??'—')+'%</div></div>';
  }).join('');

  app.innerHTML=
    '<div class="candidateDash">'+
      '<div class="candidateTop">'+
        '<div class="candidateBrand"><div class="candidateMark">RZ7</div><div><div class="candidateKicker">LA HERMANDAD RZ7</div><h1 class="candidateTitle">PAINEL DO CANDIDATO</h1></div></div>'+
        '<button class="ghost" id="out">SAIR</button>'+
      '</div>'+
      '<section class="candidateWelcome candidateCard">'+
        '<h2>BEM-VINDO, '+firstName+'</h2>'+
        '<p>Esta é sua área pessoal de avaliação. Acompanhe as provas disponíveis e consulte seus resultados.</p>'+
        '<span class="candidateStatus">● CONTA ATIVA</span>'+
      '</section>'+
      '<div class="candidateGrid">'+
        '<section class="candidateCard">'+
          '<h2>👤 MEU CADASTRO</h2>'+
          '<div class="candidateProfile">'+profileFields.map(x=>'<div class="candidateField"><span>'+x[0]+'</span><span>'+esc(x[1])+'</span></div>').join('')+'</div>'+
        '</section>'+
        '<section class="candidateCard featured">'+
          '<h2>📜 PROVAS DISPONÍVEIS</h2>'+
          (proofHtml?'<div class="candidateProofList">'+proofHtml+'</div>':'<div class="candidateProofEmpty"><div class="emptyIcon">📜</div><strong>Nenhuma prova está disponível</strong><p>Aguarde a abertura de uma nova avaliação pelos instrutores.</p></div>')+
        '</section>'+
      '</div>'+
      '<section class="candidateCard candidateResults">'+
        '<h2>🏆 MEUS RESULTADOS</h2>'+
        (resultHtml?'<div class="candidateProofList">'+resultHtml+'</div>':'<div class="candidateProofEmpty"><div class="emptyIcon">🏆</div><strong>Nenhuma avaliação concluída</strong><p>Seus resultados aparecerão aqui após realizar uma prova.</p></div>')+
      '</section>'+
    '</div>';

  document.getElementById('out').onclick=async()=>{clearInterval(timer);await sbCandidate.auth.signOut();document.querySelector('#menu [data-go="admin"]').style.display='block';go('home')};
  document.querySelector('#menu [data-go="admin"]').style.display='block';
  app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startOrRequest(b.dataset.start));
}
async function startOrRequest(id){const {data:p}=await sb.from('rz7_proofs').select('*').eq('id',id).single();if(p.visibility==='private'){const {data:r}=await sb.from('rz7_proof_access_requests').select('*').eq('proof_id',id).eq('candidate_id',me.id).maybeSingle();if(!r){const {error}=await sb.from('rz7_proof_access_requests').insert({proof_id:id,candidate_id:me.id});if(error)return toast(error.message);return toast('Solicitação enviada. Aguarde autorização do instrutor.')}if(r.status!=='approved')return toast(r.status==='pending'?'Aguardando autorização.':'Solicitação negada.')}const {data,error}=await sb.rpc('rz7_start_proof',{p_proof:id});if(error)return toast(error.message);currentAttempt=data;takeProof(id,data)}
async function takeProof(pid,aid){
 const {data:q,error:qe}=await sb.from('rz7_proof_questions').select('id,position,question,points,question_type').eq('proof_id',pid).order('position');if(qe)return toast(qe.message);
 const qids=(q||[]).map(x=>x.id);const {data:o}=qids.length?await sb.from('rz7_proof_options').select('id,question_id,position,label').in('question_id',qids):{data:[]};
 const questions=(q||[]).map(x=>({...x,rz7_proof_options:(o||[]).filter(y=>y.question_id===x.id).sort((a,b)=>a.position-b.position)}));let idx=0,answers={},multiAnswers={},textAnswers={};
 function render(){const qq=questions[idx],type=qq.question_type||'single',selected=multiAnswers[qq.id]||[],remain=questions.length?Math.round((idx/questions.length)*100):0;
   const optionHtml=type==='text'?'<textarea id="textAnswer" class="form" style="margin-top:12px;min-height:150px" placeholder="Escreva sua resposta...">'+esc(textAnswers[qq.id]||'')+'</textarea>':'<div>'+qq.rz7_proof_options.map((o,oi)=>{const on=type==='multiple'?selected.includes(o.id):answers[qq.id]===o.id;return '<button class="option '+(on?'selected':'')+'" data-o="'+o.id+'"><b style="color:var(--gold);margin-right:8px">'+String.fromCharCode(65+oi)+')</b>'+esc(o.label)+'</button>'}).join('')+'</div>';
   const typeLabel=type==='multiple'?'☑️ MÚLTIPLA ESCOLHA — selecione todas as corretas':type==='text'?'✍️ RESPOSTA ESCRITA':'🔘 RESPOSTA ÚNICA — selecione uma alternativa';
   app.innerHTML='<div class="sectionTitle"><h1>📝 PROVA</h1><span id="clock" class="pill"></span></div><div class="progress"><i style="width:'+remain+'%"></i></div><div class="card question"><div class="small muted">Questão '+(idx+1)+' de '+questions.length+'</div><div class="small goldtxt" style="margin-top:6px">'+typeLabel+'</div><h2>'+esc(qq.question)+'</h2>'+optionHtml+'<div class="actions" style="margin-top:14px">'+(idx?'<button class="ghost" id="prev">← ANTERIOR</button>':'')+(idx<questions.length-1?'<button class="primary" id="next">PRÓXIMA →</button>':'<button class="primary" id="finish">FINALIZAR PROVA</button>')+'</div></div>';
   app.querySelectorAll('[data-o]').forEach(b=>b.onclick=async()=>{if(type==='multiple'){const next=selected.includes(b.dataset.o)?selected.filter(x=>x!==b.dataset.o):[...selected,b.dataset.o];multiAnswers[qq.id]=next;const {error}=await sb.rpc('rz7_save_multiple_answer',{p_attempt:aid,p_question:qq.id,p_options:next});if(error)return toast(error.message)}else{answers[qq.id]=b.dataset.o;const {error}=await sb.rpc('rz7_save_answer',{p_attempt:aid,p_question:qq.id,p_option:b.dataset.o,p_answer_text:null});if(error)return toast(error.message)}render()});
   const ta=document.getElementById('textAnswer');if(ta)ta.onblur=async()=>{textAnswers[qq.id]=ta.value;const {error}=await sb.rpc('rz7_save_answer',{p_attempt:aid,p_question:qq.id,p_option:null,p_answer_text:ta.value});if(error)return toast(error.message)};
   if(document.getElementById('prev'))document.getElementById('prev').onclick=()=>{idx--;render()};
   const validate=async()=>{if(type==='text'){const ta=document.getElementById('textAnswer');if(!ta||!ta.value.trim())return toast('Digite sua resposta.'),false;textAnswers[qq.id]=ta.value;const {error}=await sb.rpc('rz7_save_answer',{p_attempt:aid,p_question:qq.id,p_option:null,p_answer_text:ta.value});if(error)return toast(error.message),false}else if(type==='multiple'){if(!(multiAnswers[qq.id]||[]).length)return toast('Selecione pelo menos uma alternativa.'),false}else if(!answers[qq.id])return toast('Selecione uma alternativa.'),false;return true};
   if(document.getElementById('next'))document.getElementById('next').onclick=async()=>{if(await validate()){idx++;render()}};if(document.getElementById('finish'))document.getElementById('finish').onclick=async()=>{if(await validate())finish()};updateClock();
 }
 function updateClock(){clearInterval(timer);const tick=async()=>{const {data:a}=await sb.from('rz7_proof_attempts').select('started_at,time_limit_seconds,status').eq('id',aid).single();if(!a)return;const left=Math.max(0,Math.floor((new Date(a.started_at).getTime()+a.time_limit_seconds*1000-Date.now())/1000));const clock=document.getElementById('clock');if(clock)clock.textContent='⏱️ '+Math.floor(left/60).toString().padStart(2,'0')+':'+(left%60).toString().padStart(2,'0');if(left<=0){clearInterval(timer);await sb.rpc('rz7_finish_proof',{p_attempt:aid});return showResult(aid)}};tick();timer=setInterval(tick,1000)}
 async function finish(){if(!confirm('Tem certeza que deseja finalizar a prova?'))return;clearInterval(timer);const {error}=await sb.rpc('rz7_finish_proof',{p_attempt:aid});if(error)return toast(error.message);showResult(aid)}render();
}

async function showResult(aid){
 const {data:a}=await sb.from('rz7_proof_attempts').select('*,rz7_proofs(code,name)').eq('id',aid).single();const approved=a.status==='approved',manual=a.status==='manual_review',timeout=a.status==='failed_timeout';const statusLabel=approved?'🟢 APROVADO':manual?'🟠 AGUARDANDO CORREÇÃO':timeout?'🔴 REPROVADO POR TEMPO':'🔴 REPROVADO';let desc=manual?'Sua prova foi enviada e contém uma ou mais respostas escritas. Um instrutor precisa corrigir essas respostas antes do resultado final ser liberado.':approved?'Parabéns, [NOME]. Você foi APROVADO na prova de conhecimento da La Hermandad RZ7.<br><br>Mas isso é apenas o começo. A partir de agora, você deverá realizar o Teste Oficial dentro do RP, onde será avaliado em situação real.<br><br>Após sua aprovação no teste, seguirá o Batismo da Hermandad — o momento em que sua entrada será oficialmente reconhecida.':'[NOME], sua avaliação foi concluída. Infelizmente, você NÃO FOI APROVADO na prova de conhecimento da La Hermandad RZ7.';desc=desc.replaceAll('[NOME]',esc(profile?.name||'candidato'));app.innerHTML='<div class="result"><div class="resultbox"><pre>╔══════════════════════════════╗\n║       RESULTADO DA PROVA     ║\n╠══════════════════════════════╣\n║ Prova: '+a.rz7_proofs.code+'\n║                              ║\n║ Questões: '+a.total_questions+'\n║ Acertos: '+a.correct_count+'\n║ Erros: '+a.wrong_count+'\n║                              ║\n║ Nota: '+(a.score??'—')+'%\n║                              ║\n║ '+statusLabel+'\n╚══════════════════════════════╝</pre></div><div class="card"><h2>'+(manual?'✍️ CORREÇÃO PENDENTE':approved?'🎖️ PROVA CONCLUÍDA':'❌ PROVA CONCLUÍDA')+'</h2><p>'+desc+'</p></div><button class="primary" onclick="candidateDash()">VOLTAR AO PAINEL</button></div>';
}

window.go=async x=>{if(x==='home')return home();if(x==='info')return info();if(x==='admin')return admin();if(x==='candidate')return candidate()};
function bindAuth(client,kind){if(!client?.auth)return;client.auth.onAuthStateChange((e)=>{if(e==='PASSWORD_RECOVERY'){const type=new URLSearchParams(location.search).get('type')||kind;if(type===kind)resetPage(kind)}})}
bindAuth(sbCandidate,'candidate');bindAuth(sbAdmin,'admin');
document.getElementById('candidateBtn').onclick=()=>candidate();(async()=>{const qs=new URLSearchParams(location.search);const reset=qs.get('reset')==='1';if(reset)return resetPage(qs.get('type')==='admin'?'admin':'candidate');try{await home()}catch(e){console.error(e);toast('Não foi possível carregar a página. Recarregue e tente novamente.')}})();
</script>
